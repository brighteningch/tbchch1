<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>✦</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">ADMIN</span>
  <h1>회원 관리</h1>
  <p>가입한 성도님들의 명단을 확인하고 관리합니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:900px;">
  <div id="adminGuard" class="admin-guard" hidden>
    <p>관리자만 접근할 수 있는 페이지입니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 후 다시 시도해주세요.</p>
  </div>

  <div id="adminContent" hidden>
    <div class="admin-toolbar">
      <p id="memberCount" style="font-weight:700;"></p>
      <button id="exportCsvBtn" class="btn btn-ghost btn-sm">엑셀(CSV)로 다운로드</button>
    </div>
    <div class="member-table-wrap">
      <table class="member-table">
        <thead>
          <tr><th>이름</th><th>직분</th><th>가입일</th><th>관리자</th><th>비밀번호</th></tr>
        </thead>
        <tbody id="memberTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 비밀번호 재설정 결과 — 새 비밀번호는 이 화면에 딱 한 번만 표시된다(다시 조회 불가) -->
<div class="modal-backdrop" id="resetPasswordModal" hidden>
  <div class="modal-box">
    <h3>새 비밀번호가 발급되었습니다</h3>
    <p id="resetPasswordTargetName" style="color:var(--text-gray); margin-bottom:12px;"></p>
    <div class="reset-password-display">
      <code id="resetPasswordValue"></code>
      <button type="button" id="resetPasswordCopyBtn" class="btn btn-ghost btn-sm">복사</button>
    </div>
    <p class="reset-password-warning">⚠ 이 비밀번호는 지금 이 화면에서만 확인할 수 있습니다.
       창을 닫으면 다시 조회할 수 없으니, 지금 성도님께 전달해주세요.</p>
    <button type="button" id="resetPasswordCloseBtn" class="btn btn-primary" style="width:100%;">확인했습니다</button>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/common.js"></script>
<script>
let __members = [];

function esc(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

let __currentUserId = null;

function renderMembers(members) {
  __members = members;
  document.getElementById('memberCount').textContent = `전체 회원 ${members.length}명`;
  document.getElementById('memberTbody').innerHTML = members.map(m => `
    <tr>
      <td data-label="이름">${esc(m.name)}</td>
      <td data-label="직분">${esc(m.position)}</td>
      <td data-label="가입일" class="member-table-joindate">${(m.created_at || '').slice(0,10)}</td>
      <td data-label="관리자">${m.is_admin ? '✓' : ''}</td>
      <td class="member-table-action">
        <button type="button" class="btn btn-ghost reset-password-btn" data-user-id="${esc(m.id)}" data-user-name="${esc(m.name)}">비밀번호 재설정</button>
        ${m.id === __currentUserId ? '' : `<button type="button" class="btn btn-ghost delete-member-btn" data-user-id="${esc(m.id)}" data-user-name="${esc(m.name)}">삭제</button>`}
      </td>
    </tr>`).join('');
}

// 관리자가 회원의 비밀번호를 새로 설정한다.
// ★이 버튼이 이 화면(admin-members.html)에만 있고 initAdminPage()의 is_admin 게이트를
// 통과해야 이 화면 자체가 보인다는 것은 어디까지나 "편의상 UI 숨김"이다. 진짜 방어선은
// supabase/functions/admin-reset-password/index.ts 안의 서버측 재검증이다 — 이 클라이언트
// 코드가 뚫리거나 우회되더라도(예: 개발자도구로 버튼을 강제로 노출) 서버가 호출자의
// is_admin을 다시 확인하기 때문에 실제 피해로 이어지지 않는다.
async function handleResetPassword(userId, userName) {
  if (!confirm(`${userName}님의 비밀번호를 새로 설정하시겠습니까?\n기존 비밀번호는 더 이상 사용할 수 없게 됩니다.`)) {
    return;
  }
  const sb = getSupabaseClient();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    alert('로그인 세션이 만료되었습니다. 다시 로그인해주세요.');
    return;
  }
  try {
    const res = await fetch(`${window.SUPABASE_URL}/functions/v1/admin-reset-password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': window.SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ userId }),
    });
    const result = await res.json();
    if (!res.ok || !result.success) {
      alert('비밀번호 재설정에 실패했습니다: ' + (result.error || `HTTP ${res.status}`));
      return;
    }
    showResetPasswordResult(userName, result.newPassword);
  } catch (err) {
    alert('비밀번호 재설정 요청 중 오류가 발생했습니다: ' + err.message);
  }
}

function showResetPasswordResult(userName, newPassword) {
  document.getElementById('resetPasswordTargetName').textContent = `${userName}님의 새 비밀번호`;
  document.getElementById('resetPasswordValue').textContent = newPassword;
  document.getElementById('resetPasswordModal').hidden = false;
}

// 관리자가 회원의 계정을 영구 삭제한다.
// ★이 버튼이 관리자 화면에만 보이는 것은 어디까지나 "편의상 UI 숨김"이다. 진짜 방어선은
// supabase/functions/admin-delete-member/index.ts 안의 서버측 재검증(관리자 재확인 + 자기자신
// 삭제 차단)이다 — 이 클라이언트 코드가 뚫리거나 우회되더라도 서버가 다시 확인하므로 실제
// 피해로 이어지지 않는다.
async function handleDeleteMember(userId, userName, rowEl) {
  if (!confirm(`${userName}님의 계정을 삭제할까요? 되돌릴 수 없습니다.`)) {
    return;
  }
  const sb = getSupabaseClient();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    alert('로그인 세션이 만료되었습니다. 다시 로그인해주세요.');
    return;
  }
  try {
    const res = await fetch(`${window.SUPABASE_URL}/functions/v1/admin-delete-member`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': window.SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ userId }),
    });
    const result = await res.json();
    if (!res.ok || !result.success) {
      alert('회원 삭제에 실패했습니다: ' + (result.error || `HTTP ${res.status}`));
      return;
    }
    __members = __members.filter(m => m.id !== userId);
    rowEl.remove();
    document.getElementById('memberCount').textContent = `전체 회원 ${__members.length}명`;
  } catch (err) {
    alert('회원 삭제 요청 중 오류가 발생했습니다: ' + err.message);
  }
}

function downloadCsv() {
  const header = ['이름','직분','가입일'];
  const rows = __members.map(m => [m.name, m.position, (m.created_at||'').slice(0,10)]);
  const csv = [header, ...rows].map(r => r.map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["﻿" + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `빛나는교회_회원목록_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

async function initAdminPage() {
  const profile = await getCurrentProfile();
  if (!profile || !profile.is_admin) {
    document.getElementById('adminGuard').hidden = false;
    return;
  }
  document.getElementById('adminContent').hidden = false;
  __currentUserId = profile.id;
  const sb = getSupabaseClient();
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) {
    document.getElementById('memberCount').textContent = '회원 목록을 불러오지 못했습니다.';
    return;
  }
  renderMembers(data);
  document.getElementById('exportCsvBtn').addEventListener('click', downloadCsv);
}

document.getElementById('memberTbody').addEventListener('click', (e) => {
  const resetBtn = e.target.closest('.reset-password-btn');
  if (resetBtn) {
    handleResetPassword(resetBtn.dataset.userId, resetBtn.dataset.userName);
    return;
  }
  const deleteBtn = e.target.closest('.delete-member-btn');
  if (deleteBtn) {
    handleDeleteMember(deleteBtn.dataset.userId, deleteBtn.dataset.userName, deleteBtn.closest('tr'));
    return;
  }
});

document.getElementById('resetPasswordCloseBtn').addEventListener('click', () => {
  document.getElementById('resetPasswordModal').hidden = true;
  document.getElementById('resetPasswordValue').textContent = '';
});

document.getElementById('resetPasswordCopyBtn').addEventListener('click', async () => {
  const value = document.getElementById('resetPasswordValue').textContent;
  try {
    await navigator.clipboard.writeText(value);
    const btn = document.getElementById('resetPasswordCopyBtn');
    const original = btn.textContent;
    btn.textContent = '복사됨';
    setTimeout(() => { btn.textContent = original; }, 1500);
  } catch {
    alert('복사에 실패했습니다. 직접 선택해 복사해주세요.');
  }
});

document.addEventListener('DOMContentLoaded', () => setTimeout(initAdminPage, 400));
</script>
</body>
</html>
