<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빛나는교회 편집부 관리 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">ADMIN</span>
  <h1>빛나는교회 편집부 관리</h1>
  <p>주제별 설교 및 양육 자료를 글과 함께(이미지 또는 PDF) 등록합니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:900px;">
  <div id="adminGuard" class="admin-guard" hidden>
    <p>관리자만 접근할 수 있는 페이지입니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 후 다시 시도해주세요.</p>
  </div>

  <div id="adminContent" hidden>
    <form id="edForm" class="sermon-form">
      <input type="hidden" id="ed-id">
      <label>제목
        <input type="text" id="ed-title" required placeholder="예: 로마서 5장 묵상 자료">
      </label>
      <div class="sermon-form-row">
        <label>날짜
          <input type="date" id="ed-date" required>
        </label>
        <label>자료 파일 (이미지 또는 PDF, 여러 장 첨부 가능)
          <input type="file" id="ed-file" accept="image/*,application/pdf" multiple>
        </label>
      </div>
      <label>간단한 글
        <textarea id="ed-body" rows="6" placeholder="자료에 대한 간단한 설명을 적어주세요."></textarea>
      </label>
      <p class="field-hint">이미지 또는 PDF를 여러 장 한 번에 선택할 수 있습니다. 수정 시 파일을 다시 선택하면 기존 파일 전체가 새로 고른 파일로 교체되고, 파일을 고르지 않으면 기존 파일이 그대로 유지됩니다.</p>
      <div class="sermon-form-actions">
        <button type="submit" class="btn btn-primary" id="ed-submit-btn">등록하기</button>
        <button type="button" class="btn btn-ghost" id="ed-cancel-btn" hidden>수정 취소</button>
      </div>
      <p class="auth-error" id="ed-error" hidden></p>
    </form>

    <div class="admin-toolbar" style="margin-top:36px;">
      <p style="font-weight:700;">등록된 자료</p>
    </div>
    <div class="sermon-table-wrap">
      <table class="sermon-table">
        <thead><tr><th>제목</th><th>날짜</th><th>형식</th><th>관리</th></tr></thead>
        <tbody id="ed-tbody"></tbody>
      </table>
    </div>
    <p class="sermon-empty" id="ed-empty" hidden>등록된 자료가 없습니다.</p>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/weekly-content-data.js"></script>
<script src="/common.js"></script>
<script>
function esc(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const ED_BUCKET = 'devotion-images';
const ED_FOLDER = 'editorial';

// ★2026-08-26: admin-news.html의 normalizeWeeklyFiles와 동일한 정규화(이 페이지는 공유
// 팩토리 없이 완전히 독립된 스크립트라 그대로 복제). data.files 배열이 있으면 그대로,
// 없고 fileUrl이 있으면(기존 단수 필드 레거시 글) 하나짜리 배열로 정규화한다(하위호환).
function normalizeWeeklyFiles(data) {
  const d = data || {};
  if (Array.isArray(d.files) && d.files.length > 0) return d.files;
  if (d.fileUrl) return [{ fileUrl: d.fileUrl, filePath: d.filePath, fileType: d.fileType }];
  return [];
}

let __edList = [];

function resetEdForm() {
  document.getElementById('ed-id').value = '';
  document.getElementById('edForm').reset();
  document.getElementById('ed-submit-btn').textContent = '등록하기';
  document.getElementById('ed-cancel-btn').hidden = true;
}

async function loadEdList() {
  __edList = await fetchWeeklyContent('editorial');
  const tbody = document.getElementById('ed-tbody');
  const empty = document.getElementById('ed-empty');
  if (__edList.length === 0) { tbody.innerHTML = ''; empty.hidden = false; return; }
  empty.hidden = true;
  tbody.innerHTML = __edList.map(item => {
    const d = item.data || {};
    const attachedFiles = normalizeWeeklyFiles(d);
    const attachLabel = attachedFiles.length === 0 ? '-'
      : attachedFiles.length === 1 ? (attachedFiles[0].fileType === 'pdf' ? 'PDF' : attachedFiles[0].fileType === 'image' ? '이미지' : '-')
      : `파일 ${attachedFiles.length}개`;
    return `
    <tr>
      <td>${esc(item.title)}</td>
      <td>${esc(item.period)}</td>
      <td>${attachLabel}</td>
      <td>
        <button type="button" class="btn btn-ghost btn-sm" data-edit="${item.id}">수정</button>
        <button type="button" class="btn btn-ghost btn-sm" data-delete="${item.id}">삭제</button>
      </td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => startEditEd(btn.dataset.edit)));
  tbody.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => removeEd(btn.dataset.delete)));
}

function startEditEd(id) {
  const item = __edList.find(x => x.id === id);
  if (!item) return;
  document.getElementById('ed-id').value = item.id;
  document.getElementById('ed-title').value = item.title || '';
  document.getElementById('ed-date').value = item.period || '';
  document.getElementById('ed-body').value = (item.data && item.data.body) || '';
  document.getElementById('ed-submit-btn').textContent = '수정 저장';
  document.getElementById('ed-cancel-btn').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function removeEd(id) {
  if (!confirm('이 자료를 삭제할까요? 되돌릴 수 없습니다.')) return;
  const item = __edList.find(x => x.id === id);
  try {
    await deleteWeeklyContent(id);
    if (item && item.data) {
      const paths = normalizeWeeklyFiles(item.data).map(f => f.filePath).filter(Boolean);
      if (paths.length > 0) {
        const sb = requireSupabaseClient();
        await sb.storage.from(ED_BUCKET).remove(paths);
      }
    }
    await loadEdList();
  } catch (err) {
    alert('삭제 중 오류가 발생했습니다: ' + err.message);
  }
}

document.getElementById('ed-cancel-btn').addEventListener('click', resetEdForm);
document.getElementById('edForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('ed-error');
  errorEl.hidden = true;
  const id = document.getElementById('ed-id').value;
  const title = document.getElementById('ed-title').value.trim();
  const date = document.getElementById('ed-date').value;
  const body = document.getElementById('ed-body').value.trim();
  // ★2026-08-26: ed-file에 multiple이 붙어 2번째 파일부터도 처리해야 한다 — 전체
  // FileList를 배열로 받는다(admin-news.html 주보/공지사항과 동일 패턴).
  const files = Array.from(document.getElementById('ed-file').files || []);
  const submitBtn = document.getElementById('ed-submit-btn');
  submitBtn.disabled = true;
  try {
    const sb = requireSupabaseClient();
    let fileData = null;
    if (id) {
      const existing = __edList.find(x => x.id === id);
      fileData = existing ? existing.data : null;
    }
    if (files.length > 0) {
      submitBtn.textContent = '업로드 중…';
      // 새 파일을 선택하면(1장이든 여러장이든) 전부 올려 data.files 배열로 저장한다
      // (이 페이지는 setupNewsTab처럼 다른 탭과 공유하지 않는 독립 스크립트라 bulletin/
      // notice처럼 multiFile 플래그로 단일/다중을 분기할 필요가 없다 — 항상 배열).
      const uploadedFiles = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const ext = (f.name.split('.').pop() || 'bin').toLowerCase();
        const fileType = f.type === 'application/pdf' || ext === 'pdf' ? 'pdf' : 'image';
        const path = `${ED_FOLDER}/${date}-${Date.now()}-${i}.${ext}`;
        const { error: uploadError } = await sb.storage.from(ED_BUCKET).upload(path, f, { upsert: false });
        if (uploadError) throw uploadError;
        const { data: pub } = sb.storage.from(ED_BUCKET).getPublicUrl(path);
        uploadedFiles.push({ fileUrl: pub.publicUrl, filePath: path, fileType });
      }
      fileData = { files: uploadedFiles };
    }
    submitBtn.textContent = id ? '수정 저장' : '등록하기';
    // ★2026-08-26 직접 발견·수정(admin-news.html 280행에서 이미 확인된 것과 동일한 버그
    // 패턴 — 별도 코드지만 같은 실수가 반복돼 있었다): 원래 `{ body, ...(fileData||{}) }`
    // 순서였다. 파일을 새로 안 고른 수정에서는 fileData=existing.data 전체(과거 body
    // 포함)라, 뒤에 스프레드되는 옛 body가 방금 입력한 새 body를 조용히 덮어써 "본문만
    // 고쳐도 저장 안 됨" 버그가 있었다. fileData를 먼저 펼치고 body를 마지막에 둬서
    // 항상 최신 입력값이 이기게 한다 — master에게 별도 보고 예정(과제 범위와 무관).
    const payload = {
      category: 'editorial', title, period: date,
      data: { ...(fileData || {}), body },
    };
    if (id) await updateWeeklyContent(id, payload); else await createWeeklyContent(payload);
    resetEdForm();
    await loadEdList();
  } catch (err) {
    errorEl.textContent = '저장 중 오류가 발생했습니다: ' + err.message;
    errorEl.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = id ? '수정 저장' : '등록하기';
  }
});

async function initAdminEditorialPage() {
  const profile = await getCurrentProfile();
  if (!profile || !profile.is_admin) {
    document.getElementById('adminGuard').hidden = false;
    return;
  }
  document.getElementById('adminContent').hidden = false;
  await loadEdList();

  const editParam = new URLSearchParams(location.search).get('edit');
  if (editParam) startEditEd(editParam);
}
document.addEventListener('DOMContentLoaded', () => setTimeout(initAdminEditorialPage, 400));
</script>
</body>
</html>
