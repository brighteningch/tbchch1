<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알림 및 공지사항 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">CHURCH NEWS</span>
  <h1>알림 및 공지사항</h1>
  <p>빛나는교회 공지사항입니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body">
  <div class="community-board-header" style="margin-top:0;">
    <div></div>
    <a href="/pages/admin-news.html?tab=notice" class="btn btn-primary btn-sm" id="noticeWriteBtn" hidden>글쓰기</a>
  </div>
  <ul class="notice-list" id="notice-list-page"></ul>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/weekly-content-data.js"></script>
<script src="/common.js"></script>
<script>
function escHtml(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

(async function () {
  try {
    const profile = await getCurrentProfile();
    if (profile && profile.is_admin) document.getElementById('noticeWriteBtn').hidden = false;
  } catch (err) { /* 비로그인 상태면 무시 */ }

  try {
    const items = await fetchMergedNotices();
    const list = document.getElementById('notice-list-page');
    if (items.length === 0) {
      list.innerHTML = '<li class="gallery-empty">아직 등록된 공지사항이 없습니다.</li>';
      return;
    }
    list.innerHTML = items.map(n => {
      const titleHtml = n.id
        ? `<a href="/pages/news-notice-view.html?id=${encodeURIComponent(n.id)}" style="color:inherit;text-decoration:none;">${escHtml(n.title)}${n.fileUrl ? ' 📎' : ''}</a>`
        : escHtml(n.title);
      const body = (!n.id && n.body) ? `<p style="margin-top:8px;color:var(--text-gray);font-size:14px;">${escHtml(n.body).replace(/\n/g,'<br>')}</p>` : '';
      return `<li style="display:block;"><div><span class="notice-date">${n.date}</span><span class="notice-title">${titleHtml}</span></div>${body}</li>`;
    }).join('');
  } catch (err) {
    document.getElementById('notice-list-page').innerHTML = '<li class="gallery-empty">공지사항을 불러오지 못했습니다.</li>';
  }
})();
</script>
</body>
</html>
