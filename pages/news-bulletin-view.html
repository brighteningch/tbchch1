<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주보 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">CHURCH NEWS</span>
  <h1>주보</h1>
  <p>매주 주보를 안내합니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:820px;">
  <h2 class="sermon-view-title" id="bulletinTitle"></h2>
  <p class="sermon-view-meta" style="margin-bottom:20px;"><span id="bulletinDate"></span></p>
  <div id="bulletinFileWrap" style="margin-bottom:24px;"></div>
  <div class="sermon-view-body" id="bulletinBody"></div>
  <div class="sermon-form-actions" style="margin-top:24px;">
    <a href="/pages/news-bulletin.html" class="btn btn-ghost">목록으로</a>
    <a href="#" class="btn btn-ghost" id="bulletinEditBtn" hidden>수정</a>
    <button type="button" class="btn btn-ghost" id="bulletinDeleteBtn" hidden>삭제</button>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/weekly-content-data.js"></script>
<script src="/common.js"></script>
<script>
function escHtml(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const params = new URLSearchParams(location.search);
const idParam = params.get('id') || '';

// ★2026-08-25: admin-news.html의 normalizeWeeklyFiles와 동일한 정규화(이 프로젝트 컨벤션 —
// 페이지마다 독립 인라인 스크립트, 공유 뷰 모듈 없음 — 을 따라 그대로 복제). data.files
// 배열이 있으면 그대로, 없고 fileUrl이 있으면(기존 단수 필드 레거시 글) 하나짜리 배열로
// 정규화해서 아래 렌더링이 항상 같은 배열 순회 코드 경로를 타게 한다(하위호환).
function normalizeWeeklyFiles(data) {
  const d = data || {};
  if (Array.isArray(d.files) && d.files.length > 0) return d.files;
  if (d.fileUrl) return [{ fileUrl: d.fileUrl, filePath: d.filePath, fileType: d.fileType }];
  return [];
}

(async function () {
  try {
    const item = await fetchWeeklyContentById(idParam);
    const d = item.data || {};
    document.getElementById('bulletinTitle').textContent = item.title || '';
    document.getElementById('bulletinDate').textContent = item.period || '';
    document.getElementById('bulletinBody').innerHTML = (d.body || '').split('\n').map(l => escHtml(l)).join('<br>');

    // ★2026-08-25: 주보 다중파일 — data.files(신규 다중 저장) 또는 기존 단수 필드(레거시
    // 글)를 normalizeWeeklyFiles로 같은 배열 형태로 맞춰 순회 렌더링한다. 이미지는
    // 나란히(next-children 갤러리와 동일하게 전체너비 세로나열), PDF는 각각 iframe+새 탭
    // 링크로 보여준다 — 여러 PDF/이미지가 섞여도 순서대로(고른 순서=업로드 순서) 표시된다.
    const fileWrap = document.getElementById('bulletinFileWrap');
    const bulletinFiles = normalizeWeeklyFiles(d);
    fileWrap.innerHTML = bulletinFiles.map(f => {
      if (f.fileType === 'image' && f.fileUrl) {
        return `<img src="${escHtml(f.fileUrl)}" alt="${escHtml(item.title)}" style="max-width:100%;border-radius:12px;margin-bottom:16px;display:block;">`;
      }
      if (f.fileType === 'pdf' && f.fileUrl) {
        return `
          <iframe src="${escHtml(f.fileUrl)}" style="width:100%;height:600px;border:1px solid var(--border-light);border-radius:12px;"></iframe>
          <div style="text-align:center;margin:12px 0 16px;"><a href="${escHtml(f.fileUrl)}" target="_blank" rel="noopener" class="btn btn-ghost">PDF 새 탭에서 열기 ↗</a></div>`;
      }
      return '';
    }).join('');

    const profile = await getCurrentProfile();
    if (profile && profile.is_admin) {
      const editBtn = document.getElementById('bulletinEditBtn');
      editBtn.hidden = false;
      editBtn.href = `/pages/admin-news.html?tab=bulletin&edit=${encodeURIComponent(item.id)}`;

      const deleteBtn = document.getElementById('bulletinDeleteBtn');
      deleteBtn.hidden = false;
      deleteBtn.addEventListener('click', async () => {
        if (!confirm('이 주보를 삭제할까요? 되돌릴 수 없습니다.')) return;
        try {
          await deleteWeeklyContent(item.id);
          const deletePaths = bulletinFiles.map(f => f.filePath).filter(Boolean);
          if (deletePaths.length > 0) {
            const sb = requireSupabaseClient();
            await sb.storage.from('devotion-images').remove(deletePaths);
          }
          location.href = '/pages/news-bulletin.html';
        } catch (err) {
          alert('삭제 중 오류가 발생했습니다: ' + err.message);
        }
      });
    }
  } catch (err) {
    document.getElementById('bulletinTitle').textContent = '내용을 찾을 수 없습니다.';
  }
})();
</script>
</body>
</html>
