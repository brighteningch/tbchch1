<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빛나는교회 편집부 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">COMMUNITY & 양육</span>
  <h1>빛나는교회 편집부</h1>
  <p>주제별 설교 및 양육 자료입니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:820px;">
  <h2 class="sermon-view-title" id="edTitle"></h2>
  <p class="sermon-view-meta" style="margin-bottom:20px;"><span id="edDate"></span></p>
  <div id="edFileWrap" style="margin-bottom:24px;"></div>
  <div class="sermon-view-body" id="edBody"></div>
  <div class="sermon-form-actions" style="margin-top:24px;">
    <a href="/pages/community-editorial.html" class="btn btn-ghost">목록으로</a>
    <a href="#" class="btn btn-ghost" id="edEditBtn" hidden>수정</a>
    <button type="button" class="btn btn-ghost" id="edDeleteBtn" hidden>삭제</button>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/weekly-content-data.js"></script>
<script src="/common.js"></script>
<script>
function escHtml(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const params = new URLSearchParams(location.search);
const idParam = params.get('id') || '';

// ★2026-08-26: admin-editorial.html의 normalizeWeeklyFiles와 동일한 정규화(독립 스크립트라
// 그대로 복제). data.files 배열이 있으면 그대로, 없고 fileUrl이 있으면(레거시 단수 필드
// 글) 하나짜리 배열로 정규화한다(하위호환).
function normalizeWeeklyFiles(data) {
  const d = data || {};
  if (Array.isArray(d.files) && d.files.length > 0) return d.files;
  if (d.fileUrl) return [{ fileUrl: d.fileUrl, filePath: d.filePath, fileType: d.fileType }];
  return [];
}

(async function () {
  try {
    const item = await fetchWeeklyContentById(idParam);
    const d = item.data || {};
    document.getElementById('edTitle').textContent = item.title || '';
    document.getElementById('edDate').textContent = item.period || '';
    document.getElementById('edBody').innerHTML = (d.body || '').split('\n').map(l => escHtml(l)).join('<br>');

    const fileWrap = document.getElementById('edFileWrap');
    const edFiles = normalizeWeeklyFiles(d);
    fileWrap.innerHTML = edFiles.map(f => {
      if (f.fileType === 'image' && f.fileUrl) {
        return `<img src="${escHtml(f.fileUrl)}" alt="${escHtml(item.title)}" style="max-width:100%;border-radius:12px;margin-bottom:16px;display:block;">`;
      }
      if (f.fileType === 'pdf' && f.fileUrl) {
        return `
          <iframe src="${escHtml(f.fileUrl)}" style="width:100%;height:600px;border:1px solid var(--border-light);border-radius:12px;"></iframe>
          <div style="text-align:center;margin:12px 0 16px;"><a href="${escHtml(f.fileUrl)}" target="_blank" rel="noopener" class="btn btn-ghost">PDF 새 탭에서 열기 ↗</a></div>`;
      }
      return '';
    }).join('');

    const profile = await getCurrentProfile();
    if (profile && profile.is_admin) {
      const editBtn = document.getElementById('edEditBtn');
      editBtn.hidden = false;
      editBtn.href = `/pages/admin-editorial.html?edit=${encodeURIComponent(item.id)}`;

      const deleteBtn = document.getElementById('edDeleteBtn');
      deleteBtn.hidden = false;
      deleteBtn.addEventListener('click', async () => {
        if (!confirm('이 자료를 삭제할까요? 되돌릴 수 없습니다.')) return;
        try {
          await deleteWeeklyContent(item.id);
          const deletePaths = edFiles.map(f => f.filePath).filter(Boolean);
          if (deletePaths.length > 0) {
            const sb = requireSupabaseClient();
            await sb.storage.from('devotion-images').remove(deletePaths);
          }
          location.href = '/pages/community-editorial.html';
        } catch (err) {
          alert('삭제 중 오류가 발생했습니다: ' + err.message);
        }
      });
    }
  } catch (err) {
    document.getElementById('edTitle').textContent = '내용을 찾을 수 없습니다.';
  }
})();
</script>
</body>
</html>
