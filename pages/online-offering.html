<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온라인헌금 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">ONLINE OFFERING</span>
  <h1>온라인헌금</h1>
  <p>온라인으로 드리는 헌금 계좌 안내입니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body">
  <div class="offering-box">
    <div class="offering-accounts" id="offering-accounts"></div>
    <p class="offering-holder">예금주 : <span data-bind="offering.holder"></span></p>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/common.js"></script>
<script>
document.addEventListener('sitedata:loaded', (e) => {
  const data = e.detail;
  document.getElementById('offering-accounts').innerHTML = data.offering.accounts.map(a => `
    <div class="offering-account">
      <span class="offering-label">${a.label}</span>
      <span class="offering-info">${a.info}</span>
    </div>`).join('');
});
</script>
</body>
</html>
