<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경공부 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">COMMUNITY & 양육</span>
  <h1>성경공부</h1>
  <p>말씀을 깊이 배우고 나누는 성경공부 안내입니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body">
  <p>빛나는교회는 성경 본문을 깊이 연구하고 삶에 적용하는 성경공부를 지향합니다. 담임목사님은 성경공부 나눔을 <strong>티스토리 블로그</strong>에 꾸준히 나누고 계시며, 아래에서 최근 글을 바로 확인하실 수 있습니다.</p>
  <h3 style="color:var(--navy);margin:24px 0 14px;">목사님 성경공부 나눔 (최신 글)</h3>
  <ul class="notice-list" id="tistory-list">
    <li class="gallery-empty">불러오는 중...</li>
  </ul>
  <div style="text-align:center;margin-top:20px;">
    <a href="https://eshallom.tistory.com/category/%EC%84%B1%EA%B2%BD%EA%B3%B5%EB%B6%80" target="_blank" rel="noopener" class="btn btn-ghost">성경공부 카테고리 전체 보기 ↗</a>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/common.js"></script>
<script>
fetch('/.netlify/functions/tistory-category')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('tistory-list');
    list.innerHTML = '';
    if (!data.items || data.items.length === 0) {
      list.innerHTML = '<li class="gallery-empty">글을 불러오지 못했습니다. 위 링크에서 확인해주세요.</li>';
      return;
    }
    data.items.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="notice-date">${item.date || ''}</span><span class="notice-title"><a href="${item.link}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">${item.title}</a></span>`;
      list.appendChild(li);
    });
  })
  .catch(() => {
    document.getElementById('tistory-list').innerHTML = '<li class="gallery-empty">글을 불러오지 못했습니다. 위 링크에서 확인해주세요.</li>';
  });
</script>
</body>
</html>
