<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기 나누기 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">COMMUNITY & 양육</span>
  <h1>이야기 나누기</h1>
  <p>가정 및 구역 예배에서 나눈 이야기입니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:700px;">
  <div id="readGuard" class="admin-guard" hidden>
    <p>로그인한 성도님만 볼 수 있는 글입니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 또는 <a href="/pages/signup.html">회원가입</a> 후 다시 열어주세요.</p>
  </div>
  <div class="community-post-detail" id="postDetailWrap" hidden>
    <h2 id="postTitle" class="sermon-view-title"></h2>
    <p class="community-post-meta" id="postMeta"></p>
    <div class="sermon-view-body" id="postBody"></div>
    <div class="sermon-image-grid" id="postImageGrid" hidden></div>
    <div class="sermon-form-actions" style="margin-top:24px;">
      <a href="/pages/community-home.html" class="btn btn-ghost">목록으로</a>
      <a href="#" class="btn btn-ghost" id="postEditLink" hidden>수정</a>
      <button type="button" class="btn btn-ghost" id="postDeleteBtn" hidden>삭제</button>
    </div>
  </div>
</div>

<div class="photo-lightbox" id="photoLightbox" hidden>
  <div class="lightbox-header">
    <div>
      <p class="lightbox-title" id="lightboxTitle"></p>
      <p class="lightbox-sub" id="lightboxSub"></p>
    </div>
    <button class="lightbox-close" id="lightboxClose" aria-label="닫기">✕</button>
  </div>
  <div class="lightbox-body">
    <div class="lightbox-grid" id="lightboxGrid"></div>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/community-data.js"></script>
<script src="/common.js"></script>
<script>
function esc(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

const params = new URLSearchParams(location.search);
const idParam = params.get('id') || '';

(async function () {
  const profile = await getCurrentProfile();
  if (!profile) {
    document.getElementById('readGuard').hidden = false;
    return;
  }
  document.getElementById('postDetailWrap').hidden = false;

  try {
    const post = await fetchCommunityPostById(idParam);
    document.getElementById('postTitle').textContent = post.title || '';
    document.getElementById('postMeta').textContent = `${post.author_name} · ${(post.created_at || '').slice(0, 10)}`;
    document.getElementById('postBody').innerHTML = esc(post.body).replace(/\n/g, '<br>');

    // 첨부사진(community_posts_images, 있을 때만 표시). 신규 글은 이 테이블만 쓰지만,
    // 혹시 모를 과거 단일이미지(post.image_url)가 있는 경우를 위한 폴백도 함께 둔다.
    let images = [];
    let imagesLoadFailed = false;
    try {
      images = await fetchCommunityPostImages(post.id);
    } catch (imgErr) {
      console.error('첨부사진을 불러오지 못했습니다:', imgErr);
      imagesLoadFailed = true;
    }
    if (images.length === 0 && post.image_url) {
      images = [{ image_url: post.image_url }];
    }
    if (images.length > 0) {
      const grid = document.getElementById('postImageGrid');
      grid.hidden = false;
      grid.innerHTML = images.map((img, i) =>
        `<button type="button" class="sermon-image-thumb" data-img-index="${i}"><img src="${esc(img.image_url)}" alt="${esc(post.title)} 첨부사진" loading="lazy"></button>`
      ).join('');
      grid.querySelectorAll('[data-img-index]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('lightboxTitle').textContent = post.title || '';
          document.getElementById('lightboxSub').textContent = `사진 ${images.length}장`;
          const lgGrid = document.getElementById('lightboxGrid');
          lgGrid.className = 'lightbox-grid lightbox-grid--stack';
          lgGrid.innerHTML = images.map(img => `<img src="${esc(img.image_url)}" alt="${esc(post.title)}">`).join('');
          document.getElementById('photoLightbox').hidden = false;
        });
      });
    }

    if (profile.id === post.author_id || profile.is_admin) {
      const editLink = document.getElementById('postEditLink');
      editLink.hidden = false;
      editLink.href = `/pages/community-write.html?edit=${encodeURIComponent(post.id)}`;

      const delBtn = document.getElementById('postDeleteBtn');
      delBtn.hidden = false;
      delBtn.addEventListener('click', async () => {
        // ★reviewer-codex 지적 반영(2026-08-14): 첨부사진 목록 조회가 실패한 채로 삭제를
        // 진행하면 어떤 Storage 파일을 지워야 할지 모르는 상태에서 글만 지워버려 사진이
        // 영구 고아로 남는다 — 조회 실패 시에는 삭제 자체를 막는다(재조회 후 재시도 유도).
        if (imagesLoadFailed) {
          alert('첨부사진 목록을 불러오지 못해 안전하게 삭제할 수 없습니다. 새로고침 후 다시 시도해주세요.');
          return;
        }
        if (!confirm('이 글을 삭제할까요?')) return;
        try {
          const sb = requireSupabaseClient();
          const imagePaths = images.map(img => img.image_path).filter(Boolean);
          if (post.image_path) imagePaths.push(post.image_path);
          // ★reviewer-codex 2차 지적 반영(2026-08-14): DB 행을 먼저 지우면, 그 다음
          // storage 삭제가 실패해도 image_path를 다시 찾을 방법이 없어 파일이 영구
          // 고아로 남고 사용자에게도 실패가 안 보인다 — storage 삭제를 먼저 시도해
          // 성공(error 없음)을 확인한 뒤에만 DB 행을 지운다. storage가 실패하면 DB는
          // 그대로 남아 image_path를 잃지 않으므로 재시도가 가능하다.
          if (imagePaths.length > 0) {
            const { error: removeError } = await sb.storage.from('community-post-images').remove(imagePaths);
            if (removeError) {
              alert('첨부사진 삭제에 실패해 글을 삭제하지 않았습니다: ' + removeError.message + ' — 다시 시도해주세요.');
              return;
            }
          }
          // ★reviewer-codex 3차 지적 반영(2026-08-14): storage 삭제 성공 후 이 DB 삭제가
          // 실패하면(네트워크·세션만료 등) 사진은 이미 없는데 글은 남아 이미지가 깨진
          // 채로 보인다 — 클라이언트만으로 두 시스템 간 완전한 원자성은 보장할 수 없어
          // "다시 시도" 안내로 수렴시킨다. storage.remove()는 이미 지워진 경로를 다시
          // 불러도 error 없이 넘어가는 멱등 동작임을 실측 확인했으므로(test_idempotent_
          // remove.js), 재시도하면 이 DB 삭제만 다시 성공하면 정상 종결된다 — 글 행이
          // DB에 그대로 남아있어 재시도 경로 자체는 안전하다.
          try {
            await deleteCommunityPost(post.id);
          } catch (dbErr) {
            alert('사진 정리는 됐지만 글 삭제가 실패했습니다: ' + dbErr.message + ' — 다시 시도해주세요.');
            return;
          }
          location.href = '/pages/community-home.html';
        } catch (err) {
          alert('삭제 중 오류가 발생했습니다: ' + err.message);
        }
      });
    }
  } catch (err) {
    document.getElementById('postTitle').textContent = '글을 찾을 수 없습니다.';
  }
})();
</script>
</body>
</html>
