<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설교요약(곱씹다) · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">SERMON · SUMMARY</span>
  <h1>설교요약(곱씹다)</h1>
  <p>말씀을 짧게 곱씹는 요약 영상입니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:1100px;">
  <div class="sermon-layout">
    <aside class="sermon-sidebar">
    <div class="sermon-sidebar-title">설교와 찬양</div>
    <div class="sermon-sidebar-group-title">말씀</div>
    <div class="sermon-sidebar-links">
      <a href="/pages/sermon-sunday.html">주일설교</a>
      <a href="/pages/sermon-wed.html">수요설교</a>
      <a href="/pages/sermon-fri.html">금요설교</a>
      <a href="/pages/sermon-special.html">특별설교</a>
      <a href="/pages/sermon-summary.html" class="active">설교요약(곱씹다)</a>
    </div>
    <div class="sermon-sidebar-group-title">찬양</div>
    <div class="sermon-sidebar-links">
      <a href="/pages/praise-wed.html">수요찬양</a>
      <a href="/pages/praise-fri.html">금요찬양</a>
    </div>
  </aside>
    <div class="sermon-main">
      <div class="community-board-header" style="margin-top:0;">
        <div></div>
        <a href="/pages/admin-sermons.html?category=3min" class="btn btn-primary btn-sm" id="summaryWriteBtn" hidden>글쓰기</a>
      </div>
      <div class="sermon-table-wrap">
        <table class="sermon-table">
          <thead>
            <tr><th>번호</th><th>제목</th><th>게시일</th><th>보기</th></tr>
          </thead>
          <tbody id="summary-tbody"></tbody>
        </table>
      </div>
      <div id="summary-pagination"></div>
      <p class="sermon-empty" id="summary-empty" hidden>아직 등록된 영상이 없습니다.</p>
    </div>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/sermons-data.js"></script>
<script src="/common.js"></script>
<script>
function escHtml(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function extractYoutubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  return m ? m[1] : null;
}
const SUMMARY_PER_PAGE = 15;
(async function () {
  const tbody = document.getElementById('summary-tbody');
  const paginationEl = document.getElementById('summary-pagination');
  let items = [];

  function renderRows(page) {
    const start = (page - 1) * SUMMARY_PER_PAGE;
    const pageItems = items.slice(start, start + SUMMARY_PER_PAGE);
    tbody.innerHTML = pageItems.map((v, i) => {
      const link = v.sermonId ? `/pages/sermon-view.html?id=${encodeURIComponent(v.sermonId)}` : `https://www.youtube.com/watch?v=${v.videoId}`;
      const linkAttrs = v.sermonId ? '' : ' target="_blank" rel="noopener"';
      const num = items.length - (start + i);
      return `
      <tr>
        <td>${num}</td>
        <td class="sermon-title"><a href="${link}"${linkAttrs}>${escHtml(v.title)}</a></td>
        <td>${(v.date || '').slice(0, 10)}</td>
        <td><a href="${link}"${linkAttrs} class="sermon-watch" aria-label="영상보기">▶</a></td>
      </tr>`;
    }).join('');
    renderPagination(paginationEl, items.length, SUMMARY_PER_PAGE, page, renderRows);
  }

  try {
    const profile = await getCurrentProfile();
    if (profile && profile.is_admin) {
      document.getElementById('summaryWriteBtn').hidden = false;
    }
  } catch (err) { /* 비로그인 상태면 무시 */ }

  try {
    const [playlistRes, manualSermons] = await Promise.all([
      fetch('/.netlify/functions/youtube-playlist').then(r => r.json()).catch(() => ({ items: [] })),
      fetchSermons('3min').catch(() => []),
    ]);

    const playlistItems = (playlistRes.items || []).map(v => ({
      title: v.title, date: (v.publishedAt || '').slice(0, 10), videoId: v.videoId, sermonId: null,
    }));
    const manualItems = manualSermons.map(s => ({
      title: s.title, date: s.date, videoId: extractYoutubeId(s.video_url), sermonId: s.id,
    }));

    // 재생목록에 이미 있는 영상을 수동으로 또 등록했으면 수동 등록본(수정/삭제 가능)을 우선한다
    const manualVideoIds = new Set(manualItems.map(m => m.videoId).filter(Boolean));
    const merged = [
      ...manualItems,
      ...playlistItems.filter(p => !manualVideoIds.has(p.videoId)),
    ];
    merged.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

    items = merged;
    if (items.length === 0) {
      document.getElementById('summary-empty').hidden = false;
      return;
    }
    renderRows(1);
  } catch (err) {
    document.getElementById('summary-empty').hidden = false;
  }
})();
</script>
</body>
</html>
