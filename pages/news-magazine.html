<html lang="ko">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">CHURCH NEWS</span>
  <h1>빛나는 매거진</h1>
  <p>교회뉴스·영화이야기·용어이야기 등 다양한 이야기를 만나보세요.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:1100px;">
  <div style="display:flex; justify-content:flex-end; margin-bottom:20px;">
    <a href="/pages/admin-magazine.html" class="btn btn-primary btn-sm" id="magazineWriteBtn" hidden>글쓰기</a>
  </div>

  <div class="magazine-layout">
    <div class="magazine-sidebar">
      <div class="magazine-cat-list" id="nm-cat-list"></div>
    </div>
    <div class="magazine-main">
      <div id="nm-sections"></div>
      <p class="magazine-empty" id="nm-empty" hidden>아직 등록된 글이 없습니다.</p>
    </div>
  </div>
</div>

<div class="nm-lightbox" id="nm-lightbox" hidden>
  <div class="nm-lightbox-backdrop" id="nm-lightbox-backdrop"></div>
  <div class="nm-lightbox-box" role="dialog" aria-modal="true" aria-labelledby="nm-lightbox-title">
    <div class="nm-lightbox-header">
      <p class="nm-lightbox-title" id="nm-lightbox-title"></p>
      <div class="nm-lightbox-actions">
        <a class="nm-lightbox-download-link" id="nm-lightbox-download-link" href="#" download>다운로드 ⬇</a>
        <a class="nm-lightbox-open-link" id="nm-lightbox-open-link" href="#" target="_blank" rel="noopener">새 탭에서 원본 열기 ↗</a>
        <button type="button" class="nm-lightbox-close" id="nm-lightbox-close" aria-label="닫기">✕</button>
      </div>
    </div>
    <div class="nm-lightbox-body" id="nm-lightbox-body"></div>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/magazine-data.js"></script>
<script src="/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js" integrity="sha384-ZqmkDa/1AGF4SKdSmXgEG+3G+Gsb6yNqUSq2Mqp0jDf1GWk+UY5eNbEd7hgwiywI" crossorigin="anonymous"></script>
<script>
function escHtml(s) { return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

// script.js(홈페이지 미리보기)의 magazineThumbHtml과 동일한 폴백 규칙 — 이 페이지는
// 자체 인라인 스크립트로 완결되는 기존 프로젝트 컨벤션(페이지마다 독립 스크립트)을 따라
// 별도 공유 모듈로 빼지 않고 그대로 복제한다.
function nmThumbHtml(post) {
  if (post.file_type === 'image') {
    return `<div class="magazine-nm-card-thumb"><img src="${post.file_url}" alt="${escHtml(post.title)}" loading="lazy"></div>`;
  }
  if (post.file_type === 'pdf') {
    return post.thumbnail_url
      ? `<div class="magazine-nm-card-thumb"><img src="${post.thumbnail_url}" alt="${escHtml(post.title)}" loading="lazy"></div>`
      : `<div class="magazine-nm-card-thumb magazine-nm-card-thumb--pdf">📄</div>`;
  }
  // ★2026-08-13: EPUB 표지 이미지 추출은 이 티켓 범위 밖(오너 확정) — 📄(PDF)와 구분되는
  // 책 아이콘 폴백만 보여준다.
  return `<div class="magazine-nm-card-thumb magazine-nm-card-thumb--pdf">📖</div>`;
}

// 카드는 더 이상 새 탭으로 나가는 <a>가 아니라 페이지 안에서 라이트박스를 여는
// <button>이다(실제 이동이 아니라 인페이지 확대이므로 시맨틱상 이게 맞다). 원본으로
// 나가는 진짜 링크는 라이트박스 안의 "새 탭에서 원본 열기"가 담당한다.
function nmCardHtml(post) {
  const badge = post.file_type === 'pdf' ? 'PDF' : post.file_type === 'epub' ? 'EPUB' : '사진';
  return `
    <button type="button" class="magazine-nm-card" data-post-id="${post.id}">
      ${nmThumbHtml(post)}
      <div class="magazine-nm-card-body">
        <p class="magazine-post-title">${escHtml(post.title)}</p>
        <p class="magazine-post-date">${(post.created_at || '').slice(0, 10)}</p>
        <span class="magazine-post-badge">${badge}</span>
      </div>
    </button>`;
}

// ---------- 라이트박스: 카드 클릭 시 새 탭 대신 페이지 안에서 확대 표시 ----------
let __nmPostsById = new Map();
let __nmEpubBook = null; // 열려 있는 동안만 유지, 닫을 때 destroy() — epub.js Book 인스턴스는 재사용하지 않고 매번 새로 연다.

// ★2026-08-13: 오너 요청 — 새 탭 보기와 별개로 실제 파일 다운로드가 보장돼야 한다
// (특히 EPUB은 브라우저가 그냥 열면 인식 못 할 수 있어 원본 다운로드 경로가 꼭 필요).
// Supabase Storage의 ?download 쿼리파라미터가 서버에서 진짜 Content-Disposition:
// attachment 헤더를 내려주는 걸 curl로 실측 확인한 뒤 이 방식을 썼다 — <a download>
// 속성만으로는 file_url이 다른 오리진(Supabase Storage)이라 브라우저가 무시할 수
// 있어 신뢰할 수 없다.
function nmDownloadUrl(post) {
  const ext = post.file_type === 'pdf' ? 'pdf' : post.file_type === 'epub' ? 'epub' : 'jpg';
  const sep = post.file_url.includes('?') ? '&' : '?';
  return `${post.file_url}${sep}download=${encodeURIComponent(`${post.title}.${ext}`)}`;
}

// ★2026-08-13(긴급): 오너가 실제 브라우저에서 "EPUB 미리보기가 안 된다"고 반복 신고 —
// Playwright(깨끗한 자동화 브라우저, 광고차단/캐시 없음)로는 매번 정상 재현됐다. 원인
// 가설을 실측 재현해보니: cdn.jsdelivr.net(epub.js/JSZip)이 차단되면 window.ePub이
// undefined인 채로 openNmLightbox 안에서 그냥 `ePub(...)`를 호출해 **uncaught
// ReferenceError**가 터지고, 그 예외가 바로 아래
// `document.getElementById('nm-lightbox').hidden = false` 줄 실행을 막아버려서
// 라이트박스 자체가 아예 안 뜬다(콘솔에러만 남고 사용자 화면은 카드 클릭에 아무 반응도
// 없는 것처럼 보임) — 이게 신고의 실제 원인일 가능성이 높다. 광고차단·네트워크 문제로
// CDN을 못 받아오는 상황 자체는 막을 수 없지만, 최소한 "왜 안 되는지 + 대신 뭘 할 수
// 있는지"는 사용자에게 보여줘야 한다(다운로드 버튼은 CDN과 무관하게 항상 작동).
let __nmEpubGeneration = 0;

function showEpubLoadError(bodyEl, reason) {
  console.error('EPUB 리더 로딩 실패:', reason);
  bodyEl.innerHTML = `
    <div class="nm-lightbox-textbody nm-epub-error">
      <p><strong>EPUB 리더를 불러오지 못했습니다.</strong></p>
      <p>네트워크 상태나 브라우저의 광고 차단 확장 프로그램이 원인일 수 있습니다.
      위의 "다운로드" 버튼으로 원본 파일을 받아서 확인해주세요.</p>
    </div>`;
}

async function loadEpubReader(post, generation) {
  const bodyEl = document.getElementById('nm-lightbox-body');
  if (typeof ePub !== 'function') {
    showEpubLoadError(bodyEl, 'epub.js 라이브러리가 로드되지 않음(CDN 차단 가능성)');
    return;
  }
  const TIMEOUT_MS = 12000;
  try {
    await Promise.race([
      (async () => {
        __nmEpubBook = ePub(post.file_url);
        // ★2026-08-13 reviewer(codex) 지적 반영: epub.js 기본값(스크립트 비활성)에
        // 암묵 의존하지 않고 allowScriptedContent:false를 명시한다(라이브러리 기본값이
        // 나중에 바뀌어도 안전). 운영 전제: 이 게시판은 관리자 전용 업로드이며, 업로드되는
        // EPUB은 신뢰된 콘텐츠로 간주한다(악성 EPUB 방어는 라이브러리 sandbox 수준까지만
        // — 완전한 서버측 zip 파싱+XHTML 스크립트 제거는 이 사이트 규모에 과한
        // 엔지니어링이라 판단해 하지 않음).
        const rendition = __nmEpubBook.renderTo('nm-epub-viewport', { width: '100%', height: '100%', allowScriptedContent: false });
        await rendition.display();
        if (generation !== __nmEpubGeneration) return; // 그 사이 라이트박스가 닫혔거나 다른 글로 넘어감
        bodyEl.querySelector('.nm-epub-nav--prev')?.addEventListener('click', () => rendition.prev());
        bodyEl.querySelector('.nm-epub-nav--next')?.addEventListener('click', () => rendition.next());
      })(),
      new Promise((_, reject) => setTimeout(() => reject(new Error(`EPUB 로딩 타임아웃(${TIMEOUT_MS}ms)`)), TIMEOUT_MS)),
    ]);
  } catch (err) {
    if (generation !== __nmEpubGeneration) return; // 이미 닫혔거나 다른 글로 넘어갔으면 화면을 덮어쓰지 않는다
    showEpubLoadError(bodyEl, err);
  }
}

function openNmLightbox(post) {
  const titleEl = document.getElementById('nm-lightbox-title');
  const linkEl = document.getElementById('nm-lightbox-open-link');
  const downloadEl = document.getElementById('nm-lightbox-download-link');
  const bodyEl = document.getElementById('nm-lightbox-body');
  titleEl.textContent = post.title;
  linkEl.href = post.file_url;
  downloadEl.href = nmDownloadUrl(post);
  if (post.file_type === 'image') {
    bodyEl.innerHTML = `<img src="${post.file_url}" alt="${escHtml(post.title)}">`;
  } else if (post.file_type === 'epub') {
    // ★2026-08-13: 오너가 AskUserQuestion으로 명시적으로 선택한 방식 — 단순 다운로드
    // 링크가 아니라 실제 책장 넘기듯 읽는 인앱 리더(epub.js). 페이지 이동은 이전/다음
    // 원형 버튼으로 제공한다. 리더 로딩(loadEpubReader)은 실패해도 여기서 절대 throw
    // 하지 않는 별도 비동기 함수로 분리했다 — 그래야 아래 라이트박스 표시 줄이 항상
    // 실행된다(수정 전엔 ePub()가 undefined 호출로 여기서 바로 터져서 라이트박스 자체가
    // 안 뜨는 문제가 있었다).
    bodyEl.innerHTML = `
      <div class="nm-epub-wrap">
        <div id="nm-epub-viewport" class="nm-epub-viewport"></div>
        <button type="button" class="nm-epub-nav nm-epub-nav--prev" aria-label="이전 페이지">‹</button>
        <button type="button" class="nm-epub-nav nm-epub-nav--next" aria-label="다음 페이지">›</button>
      </div>`;
    loadEpubReader(post, ++__nmEpubGeneration);
  } else {
    bodyEl.innerHTML = `<iframe src="${post.file_url}" title="${escHtml(post.title)}"></iframe>`;
  }
  document.getElementById('nm-lightbox').hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeNmLightbox() {
  __nmEpubGeneration++; // 진행 중인 loadEpubReader가 있다면 결과를 무시하게 한다
  document.getElementById('nm-lightbox').hidden = true;
  document.body.style.overflow = '';
  if (__nmEpubBook) {
    try { __nmEpubBook.destroy(); } catch (err) { /* 이미 정리된 상태면 무시 */ }
    __nmEpubBook = null;
  }
  // 닫을 때 iframe/img src를 비워 PDF 뷰어·이미지 로딩을 확실히 중단시킨다.
  document.getElementById('nm-lightbox-body').innerHTML = '';
}

document.getElementById('nm-lightbox-backdrop').addEventListener('click', closeNmLightbox);
document.getElementById('nm-lightbox-close').addEventListener('click', closeNmLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('nm-lightbox').hidden) closeNmLightbox();
});

// 카테고리 클릭 시 목록을 통째로 바꿔치기하던 예전 방식 대신, 카테고리별 섹션을 전부
// 한 페이지에 순서대로 렌더링하고 사이드바는 그 섹션으로 스크롤 이동하는 앵커 내비게이션으로
// 바꾼다. 카테고리 목록/전체 글을 각각 두 번 조회하던 것도 한 번의 fetchMagazinePosts()
// 호출 결과에서 그룹핑하는 것으로 합쳐 왕복을 줄인다.
let __nmObserver = null;

async function loadMagazinePage() {
  const catListEl = document.getElementById('nm-cat-list');
  const sectionsEl = document.getElementById('nm-sections');
  const emptyEl = document.getElementById('nm-empty');
  try {
    const posts = await fetchMagazinePosts();
    if (posts.length === 0) {
      catListEl.innerHTML = '';
      sectionsEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    const grouped = new Map();
    posts.forEach(p => {
      if (!grouped.has(p.category)) grouped.set(p.category, []);
      grouped.get(p.category).push(p);
    });
    // '교회뉴스'는 홈페이지 featured 카테고리와 동일하게 이 페이지에서도 항상 맨 위에
    // 오도록 고정한다(오너 요청) — 나머지 카테고리는 기존 순서(최신 글 기준) 그대로.
    const categories = Array.from(grouped.keys());
    const featuredIdx = categories.indexOf('교회뉴스');
    if (featuredIdx > 0) {
      categories.splice(featuredIdx, 1);
      categories.unshift('교회뉴스');
    }

    __nmPostsById = new Map(posts.map(p => [String(p.id), p]));

    catListEl.innerHTML = categories.map((c, i) => `
      <a href="#nm-section-${i}" class="magazine-cat-btn" data-index="${i}">${escHtml(c)}</a>`).join('');

    sectionsEl.innerHTML = categories.map((c, i) => `
      <section class="magazine-nm-section" id="nm-section-${i}">
        <div class="magazine-nm-section-head">
          <h2 class="magazine-nm-section-title">${escHtml(c)}</h2>
          <span class="magazine-nm-section-count">${grouped.get(c).length}건</span>
        </div>
        <div class="magazine-nm-grid">
          ${grouped.get(c).map(nmCardHtml).join('')}
        </div>
      </section>`).join('');

    sectionsEl.querySelectorAll('[data-post-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const post = __nmPostsById.get(btn.dataset.postId);
        if (post) openNmLightbox(post);
      });
    });

    // 스크롤 중 화면에 걸쳐 있는 섹션의 사이드바 항목을 활성 표시한다.
    if (__nmObserver) __nmObserver.disconnect();
    __nmObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const idx = entry.target.id.replace('nm-section-', '');
        document.querySelectorAll('#nm-cat-list .magazine-cat-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.index === idx);
        });
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('.magazine-nm-section').forEach(el => __nmObserver.observe(el));
    if (categories.length > 0) {
      document.querySelector('#nm-cat-list .magazine-cat-btn').classList.add('active');
    }

    // 마지막 섹션이 한 화면보다 짧으면 그 아래로 스크롤할 여지가 없어(문서가 거기서 끝남)
    // 관찰 트리거 영역이 이전 섹션에 걸쳐 있는 채로 멈출 수 있다 — 페이지 맨 아래 근처면
    // 무조건 마지막 카테고리를 활성 표시해 이 경우를 보정한다.
    window.addEventListener('scroll', () => {
      const nearBottom = window.scrollY + window.innerHeight >= document.body.scrollHeight - 4;
      if (!nearBottom) return;
      const btns = document.querySelectorAll('#nm-cat-list .magazine-cat-btn');
      btns.forEach((btn, i) => btn.classList.toggle('active', i === btns.length - 1));
    }, { passive: true });
  } catch (err) {
    console.error('빛나는 매거진 목록 로드 실패:', err);
    catListEl.innerHTML = '';
    sectionsEl.innerHTML = '';
    emptyEl.hidden = false;
  }
}

(async function () {
  try {
    const profile = await getCurrentProfile();
    if (profile && profile.is_admin) {
      document.getElementById('magazineWriteBtn').hidden = false;
    }
  } catch (err) { /* 로그인 안 한 방문자는 무시 */ }
  await loadMagazinePage();
})();
</script>
</body>
</html>
