<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴 관리 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>✦</text></svg>">
<link rel="stylesheet" href="/style.css">
<style>
  .nm-group { border:1.5px solid var(--border-light); border-radius:10px; padding:16px; margin-bottom:16px; }
  .nm-group-label-input { width:100%; max-width:360px; padding:9px 12px; border-radius:8px; border:1.5px solid var(--border-light); font-size:16px; font-weight:700; margin-bottom:12px; }
  .nm-item-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .nm-item-label-input { flex:1 1 160px; min-width:120px; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border-light); }
  .nm-item-href-input { flex:1 1 220px; min-width:160px; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border-light); font-family:monospace; font-size:13px; }
  .nm-item-btns { display:flex; gap:4px; }
  .nm-item-btns button { padding:6px 9px; font-size:13px; }
  .nm-add-item-btn { margin-top:4px; }
  .nm-save-bar { position:sticky; bottom:0; background:var(--bg-white); padding:14px 0; border-top:1.5px solid var(--border-light); margin-top:20px; display:flex; align-items:center; gap:12px; }
  .nm-instagram-note { font-size:12.5px; color:var(--text-gray); margin-top:4px; }
  .nm-hero-block { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; padding:10px; background:var(--bg-cool); border-radius:8px; }
  .nm-hero-preview { width:96px; height:54px; object-fit:cover; border-radius:6px; display:block; }
  .nm-hero-status { font-size:12.5px; color:var(--text-gray); }
  .nm-hero-note { font-size:12.5px; color:var(--text-gray); margin-bottom:12px; }
</style>
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">ADMIN</span>
  <h1>메뉴 관리</h1>
  <p>홈페이지 상단 메뉴(그룹 제목과 그 안의 항목들)를 직접 편집합니다. 그룹의 개수·순서는 고정이며, 각 그룹의 제목과 그 안 항목의 추가·삭제·순서·라벨·링크만 편집할 수 있습니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:820px;">
  <div id="adminGuard" class="admin-guard" hidden>
    <p>관리자만 접근할 수 있는 페이지입니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 후 다시 시도해주세요.</p>
  </div>

  <div id="adminContent" hidden>
    <p id="nmError" style="color:#c0392b; margin-bottom:12px;" hidden></p>
    <div id="nmGroups"></div>
    <div class="nm-save-bar">
      <button type="button" class="btn btn-primary" id="nmSaveBtn">전체 저장</button>
      <span id="nmSaveMsg" style="font-size:13px; color:var(--text-gray);"></span>
    </div>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/settings-data.js"></script>
<script src="/common.js"></script>
<script>
const NAV_MENU_SETTING_KEY = 'nav_menu';
let __navMenu = null; // { groups: [{ label, items: [{label, href}] }] }

function escNmHtml(s) { return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

function renderNavMenuForm() {
  const host = document.getElementById('nmGroups');
  if (!__navMenu) { host.innerHTML = ''; return; }
  host.innerHTML = __navMenu.groups.map((g, gi) => `
    <div class="nm-group">
      <input type="text" class="nm-group-label-input" data-group="${gi}" data-role="group-label" value="${escNmHtml(g.label)}" placeholder="그룹 제목">
      <div class="nm-hero-block" data-group="${gi}">
        ${g.heroImage ? `<img class="nm-hero-preview" src="${escNmHtml(g.heroImage)}" alt="">` : ''}
        <input type="file" class="nm-hero-file-input" data-group="${gi}" accept="image/jpeg,image/png,image/webp">
        ${g.heroImage ? `<button type="button" class="btn btn-ghost btn-sm" data-action="remove-hero" data-group="${gi}">대표이미지 제거</button>` : ''}
        <span class="nm-hero-status" data-group="${gi}"></span>
      </div>
      <p class="nm-hero-note">이 그룹의 대표이미지는 이 그룹에 속한 모든 하위 페이지 상단(제목이 있는 남색 박스)의 배경으로 적용됩니다. 설정하지 않으면 기존 남색 배경 그대로 유지됩니다.</p>
      <div class="nm-items" data-group="${gi}">
        ${g.items.map((it, ii) => `
          <div class="nm-item-row" data-group="${gi}" data-item="${ii}">
            <input type="text" class="nm-item-label-input" data-group="${gi}" data-item="${ii}" data-role="item-label" value="${escNmHtml(it.label)}" placeholder="항목 이름">
            <input type="text" class="nm-item-href-input" data-group="${gi}" data-item="${ii}" data-role="item-href" value="${escNmHtml(it.href)}" placeholder="/pages/example.html">
            <div class="nm-item-btns">
              <button type="button" data-action="move-up" data-group="${gi}" data-item="${ii}" ${ii === 0 ? 'disabled' : ''} title="위로">↑</button>
              <button type="button" data-action="move-down" data-group="${gi}" data-item="${ii}" ${ii === g.items.length - 1 ? 'disabled' : ''} title="아래로">↓</button>
              <button type="button" data-action="delete-item" data-group="${gi}" data-item="${ii}" title="삭제">삭제</button>
            </div>
          </div>`).join('')}
      </div>
      <button type="button" class="btn btn-ghost btn-sm nm-add-item-btn" data-action="add-item" data-group="${gi}">+ 항목 추가</button>
      ${gi === 4 ? '<p class="nm-instagram-note">※ 이 그룹의 "공식 인스타그램" 링크는 여기서 편집할 수 없습니다 — 홈페이지 관리(연락처)의 인스타그램 주소 설정을 따로 따릅니다.</p>' : ''}
    </div>`).join('');
}

document.getElementById('nmGroups').addEventListener('input', (e) => {
  const role = e.target.dataset.role;
  if (!role) return;
  const gi = Number(e.target.dataset.group);
  if (role === 'group-label') {
    __navMenu.groups[gi].label = e.target.value;
    return;
  }
  const ii = Number(e.target.dataset.item);
  if (role === 'item-label') __navMenu.groups[gi].items[ii].label = e.target.value;
  if (role === 'item-href') __navMenu.groups[gi].items[ii].href = e.target.value;
});

// 그룹 대표이미지(heroImage) 업로드·제거. Storage 버킷 'nav-hero-images'에 그룹의 안정적
// id(라벨이 아님 — 라벨을 바꿔도 이미지가 유지돼야 하므로)를 파일명으로 upsert한다.
const NAV_HERO_BUCKET = 'nav-hero-images';

function ensureGroupId(group) {
  if (!group.id) group.id = crypto.randomUUID();
  return group.id;
}

async function uploadGroupHeroImage(gi, file) {
  const statusEl = document.querySelector(`.nm-hero-status[data-group="${gi}"]`);
  const group = __navMenu.groups[gi];
  const groupId = ensureGroupId(group);
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  statusEl.textContent = '업로드 중...';
  try {
    const sb = requireSupabaseClient();
    const path = `${groupId}.${ext}`;
    const { error: uploadError } = await sb.storage.from(NAV_HERO_BUCKET).upload(path, file, { upsert: true });
    if (uploadError) throw uploadError;
    const { data: pub } = sb.storage.from(NAV_HERO_BUCKET).getPublicUrl(path);
    group.heroImage = pub.publicUrl;
    renderNavMenuForm();
  } catch (err) {
    statusEl.textContent = '업로드 실패: ' + err.message;
  }
}

async function removeGroupHeroImage(gi) {
  const group = __navMenu.groups[gi];
  if (!group.heroImage) return;
  if (!confirm('이 그룹의 대표이미지를 제거할까요?')) return;
  try {
    const sb = requireSupabaseClient();
    // 파일 경로는 URL 마지막 세그먼트(예: {groupId}.jpg)로 역산한다.
    const path = decodeURIComponent(group.heroImage.split('/').pop());
    await sb.storage.from(NAV_HERO_BUCKET).remove([path]);
  } catch (err) {
    console.error('대표이미지 파일 삭제 실패(설정에서는 제거됨):', err);
  }
  group.heroImage = null;
  renderNavMenuForm();
}

document.getElementById('nmGroups').addEventListener('change', (e) => {
  if (!e.target.classList.contains('nm-hero-file-input')) return;
  const gi = Number(e.target.dataset.group);
  const file = e.target.files[0];
  if (file) uploadGroupHeroImage(gi, file);
});

document.getElementById('nmGroups').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const gi = Number(btn.dataset.group);
  if (action === 'remove-hero') {
    removeGroupHeroImage(gi);
    return;
  }
  const items = __navMenu.groups[gi].items;
  if (action === 'add-item') {
    items.push({ label: '', href: '' });
  } else if (action === 'delete-item') {
    const ii = Number(btn.dataset.item);
    if (!confirm('이 항목을 삭제할까요?')) return;
    items.splice(ii, 1);
  } else if (action === 'move-up') {
    const ii = Number(btn.dataset.item);
    if (ii <= 0) return;
    [items[ii - 1], items[ii]] = [items[ii], items[ii - 1]];
  } else if (action === 'move-down') {
    const ii = Number(btn.dataset.item);
    if (ii >= items.length - 1) return;
    [items[ii + 1], items[ii]] = [items[ii], items[ii + 1]];
  } else {
    return;
  }
  renderNavMenuForm();
});

// ★href 스킴 검증(reviewer-codex 보안검토 REVISE 반영, 2026-08-12) — common.js의 isSafeNavHref와
// 동일 규칙. 이 페이지는 별도 <script> 파일이라 common.js의 함수를 그대로 재사용할 수 없어(로드
// 순서상 이 페이지에도 common.js가 있지만, 저장쪽 검증은 admin-nav-menu.html 자체 스크립트에서
// 완결돼야 저장을 막을 수 있다) 같은 규칙을 여기 한 번 더 정의한다. "javascript:" 같은 악성
// 링크가 관리자 실수(또는 탈취된 세션)로 저장되면 모든 방문자에게 실행되는 저장형 XSS가 된다.
function isSafeNavHref(href) {
  return typeof href === 'string' && /^(\/(?!\/)|https:\/\/|mailto:|tel:|#)/i.test(href.trim());
}

// heroImage는 Storage getPublicUrl 결과(https://...)만 들어와야 한다. common.js의
// isSafeImageUrl과 동일 규칙(파일이 분리돼있어 중복 정의).
function isSafeImageUrl(url) {
  return url === null || url === undefined || (typeof url === 'string' && /^https:\/\//i.test(url.trim()));
}

// 유효하면 null, 아니면 관리자가 바로 어디를 고쳐야 하는지 알 수 있는 문구를 반환한다.
// ★그룹 개수는 고정하지 않는다(오너 정정지시, 2026-08-12) — 최초에는 "그룹 6개 고정"으로
// 설계했으나 그룹 자체의 추가·삭제도 허용하는 쪽으로 방향이 바뀌어 최소 1개 이상만 요구한다.
function validateNavMenuForSave(data) {
  if (!data || !Array.isArray(data.groups)) return '메뉴 데이터 형식에 문제가 있습니다.';
  if (data.groups.length === 0) return '그룹이 최소 1개는 있어야 합니다.';
  for (let gi = 0; gi < data.groups.length; gi++) {
    const g = data.groups[gi];
    if (!g || typeof g.label !== 'string' || !g.label.trim()) {
      return `${gi + 1}번째 그룹의 제목이 비어 있습니다.`;
    }
    if (!isSafeImageUrl(g.heroImage)) {
      return `"${g.label}" 그룹의 대표이미지 값에 문제가 있습니다. 다시 업로드해주세요.`;
    }
    if (!Array.isArray(g.items)) return `${gi + 1}번째 그룹의 항목 목록에 문제가 있습니다.`;
    for (let ii = 0; ii < g.items.length; ii++) {
      const it = g.items[ii];
      if (!it || typeof it.label !== 'string' || !it.label.trim()) {
        return `"${g.label}" 그룹의 ${ii + 1}번째 항목 이름이 비어 있습니다.`;
      }
      if (!isSafeNavHref(it.href)) {
        return `"${g.label}" 그룹의 "${it.label}" 항목 링크(${it.href})가 허용되지 않는 형식입니다. "/"로 시작하는 내부 경로, "https://"로 시작하는 외부 주소, "mailto:"(이메일), "tel:"(전화), "#"만 사용할 수 있습니다.`;
      }
    }
  }
  return null;
}

document.getElementById('nmSaveBtn').addEventListener('click', async () => {
  const msgEl = document.getElementById('nmSaveMsg');
  msgEl.style.color = 'var(--text-gray)';
  msgEl.textContent = '저장 중...';
  const validationError = validateNavMenuForSave(__navMenu);
  if (validationError) {
    msgEl.style.color = '#c0392b';
    msgEl.textContent = validationError;
    return;
  }
  try {
    await upsertAppSetting(NAV_MENU_SETTING_KEY, JSON.stringify(__navMenu));
    msgEl.style.color = 'var(--text-gray)';
    msgEl.textContent = '저장되었습니다. 다른 페이지를 새로고침하면 반영됩니다.';
  } catch (err) {
    msgEl.style.color = '#c0392b';
    msgEl.textContent = '저장 실패: ' + err.message;
  }
});

// app_settings에 nav_menu 값이 아직 한 번도 저장된 적 없는 최초 상태(reviewer-gemini 제안
// 반영, 2026-08-12)를 위한 폴백 — header.html의 현재 정적 메뉴를 파싱해 그대로 편집 시작
// 화면으로 보여준다("아직 저장된 값이 없습니다" 에러만 보고 당황하지 않도록). #instagramLink는
// 이 기능의 편집 대상이 아니므로(common.js의 buildNavMenuHtml과 동일 원칙) 파싱 결과에서
// 제외한다.
async function parseNavMenuFromHeaderHtml() {
  const res = await fetch('/partials/header.html');
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const groups = Array.from(doc.querySelectorAll('.mm-item')).map(item => {
    const label = (item.querySelector('.mm-trigger')?.childNodes[0]?.textContent || '').trim();
    const items = Array.from(item.querySelectorAll('.mm-panel a'))
      .filter(a => a.id !== 'instagramLink')
      .map(a => ({ label: (a.textContent || '').trim(), href: a.getAttribute('href') || '' }));
    return { id: crypto.randomUUID(), label, items, heroImage: null };
  });
  return { groups };
}

async function initAdminNavMenuPage() {
  const profile = await getCurrentProfile();
  if (!profile || !profile.is_admin) {
    document.getElementById('adminGuard').hidden = false;
    return;
  }
  document.getElementById('adminContent').hidden = false;
  const errEl = document.getElementById('nmError');
  try {
    const raw = await fetchAppSetting(NAV_MENU_SETTING_KEY);
    let parsed;
    if (!raw) {
      parsed = await parseNavMenuFromHeaderHtml();
    } else {
      parsed = JSON.parse(raw);
    }
    const loadError = validateNavMenuForSave(parsed);
    if (loadError) throw new Error('메뉴 설정의 형식이 올바르지 않습니다: ' + loadError);
    __navMenu = parsed;
    renderNavMenuForm();
  } catch (err) {
    errEl.textContent = '메뉴 설정을 불러오지 못했습니다: ' + err.message;
    errEl.hidden = false;
  }
}

document.addEventListener('DOMContentLoaded', () => setTimeout(initAdminNavMenuPage, 400));
</script>
</body>
</html>
