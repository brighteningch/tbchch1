<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중보기도요청 작성 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">COMMUNITY & 양육</span>
  <h1>🙏 중보기도요청 작성</h1>
  <p>함께 기도해주셨으면 하는 마음을 나눠주세요.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:700px;">
  <div id="writeGuard" class="admin-guard" hidden>
    <p>회원가입 후 로그인해야 기도요청을 작성할 수 있습니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 또는 <a href="/pages/signup.html">회원가입</a> 후 다시 시도해주세요.</p>
  </div>

  <form id="communityForm" class="community-form" hidden>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;">제목
      <input type="text" id="cTitle" placeholder="예: ○○ 집사님을 위해 기도해주세요" required>
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;">내용
      <textarea id="cBody" rows="10" placeholder="나누고 싶은 기도 제목을 적어주세요." required></textarea>
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;">사진 첨부 (여러 장 선택 가능, JPG·PNG만)
      <input type="file" id="cImages" accept="image/jpeg,image/png" multiple>
    </label>
    <div class="cpi-image-grid" id="cImagePreview"></div>
    <div class="sermon-form-actions">
      <button type="submit" class="btn btn-primary" id="cSubmitBtn">등록하기</button>
      <a href="/pages/prayer-request.html" class="btn btn-ghost" id="cCancelLink">취소</a>
    </div>
    <p class="auth-error" id="communityFormError" hidden></p>
  </form>
  <p class="auth-error" id="editGuardError" hidden></p>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/community-data.js"></script>
<script src="/common.js"></script>
<script>
const BOARD = "prayer-request";
const COMMUNITY_POST_IMAGE_BUCKET = 'community-post-images';
let __profile = null;
let __pendingImageFiles = [];
let __existingImages = []; // 수정 모드에서만 채워짐 — 이미 저장된 사진(즉시 삭제 가능)
let __editingId = null; // null이면 신규 작성, 아니면 이 id를 수정 중

function renderCImagePreview() {
  const wrap = document.getElementById('cImagePreview');
  const existingHtml = __existingImages.map(img => `
    <div class="cpi-image-item">
      <img src="${img.image_url}" alt="">
      <button type="button" class="cpi-image-remove" data-remove-existing="${img.id}" aria-label="이 사진 삭제">✕</button>
    </div>`).join('');
  const pendingHtml = __pendingImageFiles.map((file, i) => `
    <div class="cpi-image-item">
      <img src="${URL.createObjectURL(file)}" alt="">
      <button type="button" class="cpi-image-remove" data-remove-pending="${i}" aria-label="선택 취소">✕</button>
    </div>`).join('');
  wrap.innerHTML = existingHtml + pendingHtml;
  wrap.querySelectorAll('[data-remove-existing]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 사진을 삭제할까요? 되돌릴 수 없습니다.')) return;
      const id = btn.dataset.removeExisting;
      const img = __existingImages.find(x => String(x.id) === id);
      try {
        await deleteCommunityPostImage(id, img ? img.image_path : null, COMMUNITY_POST_IMAGE_BUCKET);
        __existingImages = __existingImages.filter(x => String(x.id) !== id);
        renderCImagePreview();
      } catch (err) {
        alert('사진 삭제 중 오류가 발생했습니다: ' + err.message);
      }
    });
  });
  wrap.querySelectorAll('[data-remove-pending]').forEach(btn => {
    btn.addEventListener('click', () => {
      __pendingImageFiles.splice(Number(btn.dataset.removePending), 1);
      renderCImagePreview();
    });
  });
}

document.getElementById('cImages').addEventListener('change', (e) => {
  const { accepted, rejected } = filterJpgPngFiles(e.target.files);
  if (rejected.length > 0) {
    alert('JPG·PNG 사진만 첨부할 수 있습니다. 다음 파일은 제외되었습니다: ' + rejected.map(f => f.name).join(', '));
  }
  __pendingImageFiles = accepted;
  renderCImagePreview();
});

async function initWritePage() {
  __profile = await getCurrentProfile();
  if (!__profile) {
    document.getElementById('writeGuard').hidden = false;
    return;
  }

  const editParam = new URLSearchParams(location.search).get('edit');
  if (editParam) {
    let post;
    try {
      post = await fetchCommunityPostById(editParam);
    } catch (err) {
      document.getElementById('editGuardError').textContent = '수정할 글을 찾을 수 없습니다: ' + err.message;
      document.getElementById('editGuardError').hidden = false;
      return;
    }
    if (!post || (post.author_id !== __profile.id && !__profile.is_admin)) {
      document.getElementById('editGuardError').textContent = '본인 글이거나 관리자만 수정할 수 있습니다.';
      document.getElementById('editGuardError').hidden = false;
      return;
    }
    __editingId = post.id;
    document.getElementById('cTitle').value = post.title || '';
    document.getElementById('cBody').value = post.body || '';
    document.getElementById('cSubmitBtn').textContent = '수정 저장';
    document.getElementById('cCancelLink').href = `/pages/prayer-request-post.html?id=${encodeURIComponent(post.id)}`;
    try {
      __existingImages = await fetchCommunityPostImages(post.id);
    } catch (err) {
      console.error('첨부사진 목록을 불러오지 못했습니다:', err);
      __existingImages = [];
    }
    renderCImagePreview();
  }

  document.getElementById('communityForm').hidden = false;
}

document.getElementById('communityForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('communityFormError');
  errorEl.hidden = true;
  const submitBtn = document.getElementById('cSubmitBtn');
  submitBtn.disabled = true;
  try {
    let post;
    if (__editingId) {
      post = await updateCommunityPost(__editingId, {
        title: document.getElementById('cTitle').value.trim(),
        body: document.getElementById('cBody').value.trim(),
      });
    } else {
      post = await createCommunityPost({
        board: BOARD,
        author_id: __profile.id,
        author_name: __profile.name,
        title: document.getElementById('cTitle').value.trim(),
        body: document.getElementById('cBody').value.trim(),
      });
    }

    if (__pendingImageFiles.length > 0) {
      // 수정 모드(__editingId)에서는 deletePostOnFailure:false로 넘긴다 — 원래부터 있던
      // 글이라 사진 업로드가 실패해도 글까지 지우면 절대 안 된다(신규 작성 롤백과는
      // 다른 상황). storage에 이미 올라간 실패분만 정리한다.
      await uploadCommunityPostImages(COMMUNITY_POST_IMAGE_BUCKET, post, __pendingImageFiles, (i, total) => {
        submitBtn.textContent = `사진 업로드 중… (${i + 1}/${total})`;
      }, { deletePostOnFailure: !__editingId });
    }

    location.href = __editingId
      ? `/pages/prayer-request-post.html?id=${encodeURIComponent(post.id)}`
      : '/pages/prayer-request.html';
  } catch (err) {
    // 사진 업로드 중 실패하면 uploadCommunityPostImages가 (모드에 맞게) 이미 정리를
    // 시도한다 — rollbackFailed로 그 정리 자체의 성패를 알려준다.
    const rollbackNote = __editingId
      ? ' (글 내용은 저장됐습니다 — 사진 처리만 다시 시도해주세요)'
      : (err.rollbackFailed
        ? ' (일부 데이터 정리에 실패했을 수 있습니다 — 새로고침 후 목록을 확인해주세요)'
        : ' (작성한 내용은 저장되지 않았습니다)');
    errorEl.textContent = (__editingId ? '수정' : '등록') + ' 중 오류가 발생했습니다: ' + err.message + rollbackNote;
    errorEl.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = __editingId ? '수정 저장' : '등록하기';
  }
});

document.addEventListener('DOMContentLoaded', () => setTimeout(initWritePage, 400));
</script>
</body>
</html>
