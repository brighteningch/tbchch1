<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>✦</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">MY ACCOUNT</span>
  <h1>비밀번호 변경</h1>
  <p>본인 계정의 비밀번호를 새로 설정합니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:420px;">
  <div id="changePasswordGuard" class="admin-guard" hidden>
    <p>로그인 후 비밀번호를 변경할 수 있습니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 후 다시 시도해주세요.</p>
  </div>

  <form id="changePasswordForm" class="auth-form" novalidate hidden>
    <label>새 비밀번호
      <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
    </label>
    <label>새 비밀번호 확인
      <input type="password" id="newPasswordConfirm" required minlength="8" autocomplete="new-password">
    </label>
    <p class="auth-error" id="changePasswordError" hidden></p>
    <p class="auth-success" id="changePasswordSuccess" hidden></p>
    <button type="submit" class="btn btn-primary" style="width:100%;" id="changePasswordSubmitBtn">비밀번호 변경</button>
  </form>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/common.js"></script>
<script>
async function initChangePasswordPage() {
  const profile = await getCurrentProfile();
  if (!profile) {
    document.getElementById('changePasswordGuard').hidden = false;
    return;
  }
  document.getElementById('changePasswordForm').hidden = false;
}

document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('changePasswordError');
  const successEl = document.getElementById('changePasswordSuccess');
  errorEl.hidden = true;
  successEl.hidden = true;

  const pw1 = document.getElementById('newPassword').value;
  const pw2 = document.getElementById('newPasswordConfirm').value;

  if (pw1.length < 8) {
    errorEl.textContent = '비밀번호는 8자 이상이어야 합니다.';
    errorEl.hidden = false;
    return;
  }
  if (pw1 !== pw2) {
    errorEl.textContent = '입력하신 두 비밀번호가 서로 다릅니다. 다시 확인해주세요.';
    errorEl.hidden = false;
    return;
  }

  const submitBtn = document.getElementById('changePasswordSubmitBtn');
  submitBtn.disabled = true;
  try {
    const sb = getSupabaseClient();
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) throw error;
    successEl.textContent = '비밀번호가 변경되었습니다. 잠시 후 홈으로 이동합니다.';
    successEl.hidden = false;
    document.getElementById('changePasswordForm').querySelectorAll('input, button').forEach(el => el.disabled = true);
    setTimeout(() => { location.href = '/'; }, 1500);
  } catch (err) {
    errorEl.textContent = '비밀번호 변경 중 오류가 발생했습니다: ' + (err.message || err);
    errorEl.hidden = false;
    submitBtn.disabled = false;
  }
});

document.addEventListener('DOMContentLoaded', () => setTimeout(initChangePasswordPage, 400));
</script>
</body>
</html>
