<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계룡시 지역 사업처 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>✦</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">지역자료실</span>
  <h1>계룡시 지역 사업처</h1>
  <p>계룡시 지역의 사업체·가게 정보를 함께 나누는 공간입니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:1100px;">
  <div id="bizGuard" class="admin-guard" hidden>
    <p>로그인 후 글을 쓸 수 있습니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 후 다시 시도해주세요.</p>
  </div>

  <form id="bizForm" class="sermon-form" hidden style="margin-bottom:32px; max-width:640px;">
    <label>제목
      <input type="text" id="biz-title" required placeholder="예: OO마트 - 계룡시 신도안면">
    </label>
    <label>내용
      <textarea id="biz-body" rows="6" required placeholder="사업체 소개, 위치, 연락처 등을 자유롭게 적어주세요."></textarea>
    </label>
    <label>사진 (선택)
      <input type="file" id="biz-image" accept="image/*">
    </label>
    <img id="biz-preview" hidden alt="선택한 사진 미리보기" style="max-width:240px;border-radius:10px;margin-top:8px;display:block;">
    <label>지도 링크 (선택)
      <input type="url" id="biz-map-url" placeholder="다음지도 등에서 위치 검색 후 나온 https:// 링크 주소">
    </label>
    <div class="sermon-form-actions">
      <button type="submit" class="btn btn-primary" id="biz-submit-btn">글 등록</button>
    </div>
    <p class="auth-error" id="biz-error" hidden></p>
  </form>

  <div id="biz-post-list" class="magazine-nm-grid"></div>
  <p class="community-empty" id="biz-empty" hidden>아직 등록된 글이 없습니다. 첫 글을 남겨보세요!</p>
</div>

<div class="nm-lightbox" id="nm-lightbox" hidden>
  <div class="nm-lightbox-backdrop" id="nm-lightbox-backdrop"></div>
  <div class="nm-lightbox-box" role="dialog" aria-modal="true" aria-labelledby="nm-lightbox-title">
    <div class="nm-lightbox-header">
      <p class="nm-lightbox-title" id="nm-lightbox-title"></p>
      <div class="nm-lightbox-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="nm-lightbox-delete" hidden>삭제</button>
        <button type="button" class="nm-lightbox-close" id="nm-lightbox-close" aria-label="닫기">✕</button>
      </div>
    </div>
    <div class="nm-lightbox-body" id="nm-lightbox-body"></div>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/community-data.js"></script>
<script src="/common.js"></script>
<script>
const BIZ_BOARD = 'community-gyeryong-business';
const BIZ_BUCKET = 'community-post-images';
function escBiz(s) { return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

let __bizProfile = null;
let __bizPosts = [];
let __bizPostsById = new Map();

// news-magazine.html의 magazine-nm-card/magazine-nm-grid/nm-lightbox 클래스를 그대로
// 재사용한다(오너 요청 — "news-magazine.html처럼"). 카드는 썸네일(사진 있으면 사진,
// 없으면 아이콘)+제목+작성자/날짜 요약만 보여주고, 본문 전체·지도 링크는 클릭해서 여는
// 라이트박스에서만 노출한다.
function bizThumbHtml(post) {
  if (post.image_url) {
    return `<div class="magazine-nm-card-thumb"><img src="${escBiz(post.image_url)}" alt="${escBiz(post.title)}" loading="lazy"></div>`;
  }
  return `<div class="magazine-nm-card-thumb magazine-nm-card-thumb--pdf">🏪</div>`;
}

function bizCardHtml(post) {
  return `
    <button type="button" class="magazine-nm-card" data-post-id="${post.id}">
      ${bizThumbHtml(post)}
      <div class="magazine-nm-card-body">
        <p class="magazine-post-title">${escBiz(post.title)}</p>
        <p class="magazine-post-date">${escBiz(post.author_name)} · ${(post.created_at || '').slice(0, 10)}</p>
      </div>
    </button>`;
}

function canDeleteBizPost(post) {
  return !!(__bizProfile && (post.author_id === __bizProfile.id || __bizProfile.is_admin));
}

function openBizLightbox(post) {
  const titleEl = document.getElementById('nm-lightbox-title');
  const bodyEl = document.getElementById('nm-lightbox-body');
  const deleteEl = document.getElementById('nm-lightbox-delete');
  titleEl.textContent = post.title;
  // isSafeMapUrl(common.js): 저장 시점(제출 핸들러)에 이미 https://만 통과시켰지만,
  // 다른 경로로 데이터가 들어왔을 가능성에 대비해 렌더링 시점에도 다시 검사한다 —
  // 통과 못하면 지도 버튼 자체를 아예 만들지 않는다(에러 없이 조용히 숨김).
  const mapButtonHtml = isSafeMapUrl(post.map_url)
    ? `<p style="margin-top:20px;"><a href="${escBiz(post.map_url)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">지도에서 보기 ↗</a></p>`
    : '';
  bodyEl.innerHTML = `
    <div class="nm-lightbox-textbody">
      ${post.image_url ? `<img src="${escBiz(post.image_url)}" alt="${escBiz(post.title)}" style="max-width:100%;border-radius:10px;margin-bottom:18px;display:block;">` : ''}
      <p style="white-space:pre-wrap;">${escBiz(post.body)}</p>
      ${mapButtonHtml}
    </div>`;
  // 삭제 버튼은 카드(<button> 안에 <button> 중첩이 되어 HTML상 유효하지 않고 클릭 이벤트도
  // 라이트박스 열기와 충돌한다)가 아니라 라이트박스 헤더로 옮겼다 — 본인 글이거나 관리자일
  // 때만 보인다.
  deleteEl.hidden = !canDeleteBizPost(post);
  deleteEl.onclick = () => removeBizPost(post.id);
  document.getElementById('nm-lightbox').hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeBizLightbox() {
  document.getElementById('nm-lightbox').hidden = true;
  document.body.style.overflow = '';
  document.getElementById('nm-lightbox-body').innerHTML = '';
}

document.getElementById('nm-lightbox-backdrop').addEventListener('click', closeBizLightbox);
document.getElementById('nm-lightbox-close').addEventListener('click', closeBizLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('nm-lightbox').hidden) closeBizLightbox();
});

async function loadBizPosts() {
  const listEl = document.getElementById('biz-post-list');
  const emptyEl = document.getElementById('biz-empty');
  __bizPosts = await fetchCommunityPosts(BIZ_BOARD);
  __bizPostsById = new Map(__bizPosts.map(p => [String(p.id), p]));
  if (__bizPosts.length === 0) {
    listEl.innerHTML = '';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;
  listEl.innerHTML = __bizPosts.map(bizCardHtml).join('');
  listEl.querySelectorAll('[data-post-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const post = __bizPostsById.get(btn.dataset.postId);
      if (post) openBizLightbox(post);
    });
  });
}

async function removeBizPost(id) {
  const post = __bizPostsById.get(String(id));
  if (!confirm(`"${post ? post.title : ''}" 글을 삭제할까요? 되돌릴 수 없습니다.`)) return;
  try {
    await deleteCommunityPost(id);
    if (post && post.image_path) {
      const sb = requireSupabaseClient();
      await sb.storage.from(BIZ_BUCKET).remove([post.image_path]);
    }
    closeBizLightbox();
    await loadBizPosts();
  } catch (err) {
    alert('삭제 중 오류가 발생했습니다: ' + err.message);
  }
}

document.getElementById('biz-image').addEventListener('change', (e) => {
  const file = e.target.files[0];
  const preview = document.getElementById('biz-preview');
  if (!file) { preview.hidden = true; preview.src = ''; return; }
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
});

document.getElementById('bizForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('biz-error');
  errorEl.hidden = true;
  const title = document.getElementById('biz-title').value.trim();
  const body = document.getElementById('biz-body').value.trim();
  const file = document.getElementById('biz-image').files[0];
  const mapUrlRaw = document.getElementById('biz-map-url').value.trim();
  const submitBtn = document.getElementById('biz-submit-btn');
  if (!title || !body) return;

  // type="url"의 브라우저 기본 검증은 "URL 모양인지"만 보고 스킴은 안 가리므로
  // javascript: 등도 통과한다 — isSafeMapUrl(common.js)로 https://만 다시 강제한다.
  let mapUrl = null;
  if (mapUrlRaw) {
    if (!isSafeMapUrl(mapUrlRaw)) {
      errorEl.textContent = '지도 링크는 https://로 시작하는 주소만 입력할 수 있습니다.';
      errorEl.hidden = false;
      return;
    }
    mapUrl = mapUrlRaw;
  }

  submitBtn.disabled = true;
  try {
    const sb = requireSupabaseClient();
    let imageUrl = null;
    let imagePath = null;
    if (file) {
      submitBtn.textContent = '업로드 중…';
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error: uploadError } = await sb.storage.from(BIZ_BUCKET).upload(path, file, { upsert: false });
      if (uploadError) throw uploadError;
      const { data: pub } = sb.storage.from(BIZ_BUCKET).getPublicUrl(path);
      imageUrl = pub.publicUrl;
      imagePath = path;
    }

    await createCommunityPost({
      board: BIZ_BOARD,
      author_id: __bizProfile.id,
      author_name: __bizProfile.name,
      title, body,
      image_url: imageUrl, image_path: imagePath,
      map_url: mapUrl,
    });

    document.getElementById('bizForm').reset();
    document.getElementById('biz-preview').hidden = true;
    await loadBizPosts();
  } catch (err) {
    errorEl.textContent = '등록 중 오류가 발생했습니다: ' + err.message;
    errorEl.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '글 등록';
  }
});

async function initBizPage() {
  __bizProfile = await getCurrentProfile();
  if (!__bizProfile) {
    document.getElementById('bizGuard').hidden = false;
  } else {
    document.getElementById('bizForm').hidden = false;
  }
  await loadBizPosts();
}

document.addEventListener('DOMContentLoaded', () => setTimeout(initBizPage, 400));
</script>
</body>
</html>
