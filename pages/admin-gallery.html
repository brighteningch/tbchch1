<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포토갤러리 관리 · 빛나는교회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f3b64%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22>✦</text></svg>">
<link rel="stylesheet" href="/style.css">
<style>
  .field-hint { font-size:12.5px; color:var(--text-gray); margin-top:-8px; }
  .ga-thumb { width:64px; height:64px; object-fit:cover; border-radius:8px; display:block; }
</style>
</head>
<body>
<div id="headerHost"></div>

<section class="page-hero">
  <span class="page-badge">ADMIN</span>
  <h1>포토갤러리 관리</h1>
  <p>행사·예배·다음세대 사진을 앨범 단위로 올리고 관리합니다.</p>
  <div class="bar"></div>
</section>

<div class="page-body" style="max-width:900px;">
  <div id="adminGuard" class="admin-guard" hidden>
    <p>로그인 후 사진을 올릴 수 있습니다.</p>
    <p style="margin-top:8px;"><a href="/pages/login.html">로그인</a> 후 다시 시도해주세요.</p>
  </div>

  <div id="adminContent" hidden>
    <a href="/pages/news-gallery.html" class="btn btn-ghost btn-sm">← 포토갤러리로</a>

    <form id="form-album" class="sermon-form" style="margin-top:20px;">
      <div class="sermon-form-row">
        <label>카테고리
          <select id="ga-category" required>
            <option value="예배">예배</option>
            <option value="다음세대">다음세대</option>
            <option value="행사">행사</option>
          </select>
        </label>
        <label>날짜
          <input type="date" id="ga-date">
        </label>
      </div>
      <label>제목
        <input type="text" id="ga-title" required placeholder="예: 2026.07.26 주일예배">
      </label>
      <label>사진 파일 (여러 장 선택 가능)
        <input type="file" id="ga-images" accept="image/*" multiple required>
      </label>
      <p class="field-hint">여러 장을 한 번에 선택해서 올리면 하나의 앨범으로 묶입니다. 첫 번째 사진이 목록의 대표 사진으로 쓰입니다.</p>
      <div class="sermon-form-actions">
        <button type="submit" class="btn btn-primary" id="ga-submit-btn">앨범 등록</button>
      </div>
      <p class="auth-error" id="ga-error" hidden></p>
    </form>

    <div class="admin-toolbar" style="margin-top:36px;">
      <p style="font-weight:700;">등록된 앨범</p>
    </div>
    <div class="sermon-table-wrap">
      <table class="sermon-table">
        <thead><tr><th>대표사진</th><th>제목</th><th>카테고리</th><th>날짜</th><th>관리</th></tr></thead>
        <tbody id="ga-tbody"></tbody>
      </table>
    </div>
    <p class="sermon-empty" id="ga-empty" hidden>등록된 앨범이 없습니다.</p>
  </div>
</div>

<div id="footerHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/member-auth.js"></script>
<script src="/gallery-data.js"></script>
<script src="/common.js"></script>
<script>
function esc(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const GALLERY_BUCKET = 'gallery-images';

let __gaAlbums = [];
let __gaProfile = null;

async function loadAlbumList() {
  __gaAlbums = await fetchGalleryAlbums();
  const tbody = document.getElementById('ga-tbody');
  const empty = document.getElementById('ga-empty');
  if (__gaAlbums.length === 0) { tbody.innerHTML = ''; empty.hidden = false; return; }
  empty.hidden = true;
  // 삭제 버튼은 본인이 올린 앨범 또는 관리자에게만 보인다(RLS도 동일 기준으로 서버측 강제 —
  // community-post.html의 profile.id === post.author_id || profile.is_admin 패턴과 동일).
  tbody.innerHTML = __gaAlbums.map(a => {
    const canDelete = __gaProfile && (__gaProfile.id === a.author_id || __gaProfile.is_admin);
    return `
    <tr>
      <td>${a.cover_image_url ? `<img class="ga-thumb" src="${a.cover_image_url}" alt="">` : ''}</td>
      <td>${esc(a.title)}</td>
      <td>${esc(a.category)}</td>
      <td>${a.album_date || ''}</td>
      <td>${canDelete ? `<button type="button" class="btn btn-ghost btn-sm" data-delete="${a.id}">삭제</button>` : ''}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => removeAlbum(btn.dataset.delete)));
}

async function removeAlbum(id) {
  const album = __gaAlbums.find(a => a.id === id);
  if (!confirm(`"${album ? album.title : ''}" 앨범과 그 안의 사진을 전부 삭제할까요? 되돌릴 수 없습니다.`)) return;
  try {
    await deleteGalleryAlbum(id);
    await loadAlbumList();
  } catch (err) {
    alert('삭제 중 오류가 발생했습니다: ' + err.message);
  }
}

document.getElementById('form-album').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('ga-error');
  errorEl.hidden = true;
  const category = document.getElementById('ga-category').value;
  const title = document.getElementById('ga-title').value.trim();
  const albumDate = document.getElementById('ga-date').value || null;
  const files = Array.from(document.getElementById('ga-images').files);
  const submitBtn = document.getElementById('ga-submit-btn');
  if (!title || files.length === 0) return;

  submitBtn.disabled = true;
  let album = null;
  try {
    const sb = requireSupabaseClient();
    // ★reviewer-codex 검토 REVISE 반영(2026-08-13): author_id를 클라이언트가 직접 지정해서
    // 보내지 않는다 — DB 컬럼 default(auth.uid())가 INSERT 시점에 서버측에서 자동으로 채운다
    // (access_gating_schema.sql). RLS 위조 방지 목적상 필수는 아니었지만(with check로 이미
    // 막혀있었음) 클라이언트가 신경 쓸 값을 하나 줄여 더 견고해진다.
    album = await createGalleryAlbum({ category, title, album_date: albumDate });

    for (let i = 0; i < files.length; i++) {
      submitBtn.textContent = `업로드 중… (${i + 1}/${files.length})`;
      const file = files[i];
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${album.id}/${Date.now()}-${i}.${ext}`;
      const { error: uploadError } = await sb.storage.from(GALLERY_BUCKET).upload(path, file, { upsert: false });
      if (uploadError) throw uploadError;
      const { data: pub } = sb.storage.from(GALLERY_BUCKET).getPublicUrl(path);
      await addGalleryPhoto({ album_id: album.id, image_url: pub.publicUrl, image_path: path, sort_order: i });
      if (i === 0) {
        await updateGalleryAlbum(album.id, { cover_image_url: pub.publicUrl });
      }
    }

    document.getElementById('form-album').reset();
    await loadAlbumList();
  } catch (err) {
    // ★reviewer-codex 검토 REVISE 반영(2026-08-13, 처리필요2): 앨범 생성→사진 업로드→커버
    // 이미지 갱신이 여러 단계로 나뉘어 있어, 중간(세션 만료 등)에 실패하면 사진 없는(또는
    // 커버 없는) 반쪽짜리 앨범이 목록에 남을 수 있었다 — 이미 앨범이 만들어진 상태에서
    // 실패했다면 그 앨범을 롤백(삭제)해 일관된 상태만 남긴다. deleteGalleryAlbum은 스토리지
    // 파일 정리까지 포함하므로 이 시점까지 올라간 사진도 함께 정리된다. 롤백 자체가 실패해도
    // (그 사이 세션이 완전히 끊기는 등) 사용자에게는 원래 에러가 더 중요하므로 화면 메시지는
    // 바꾸지 않고 콘솔에만 남긴다.
    if (album) {
      try {
        await deleteGalleryAlbum(album.id);
      } catch (rollbackErr) {
        console.error('실패한 앨범 롤백(삭제) 중 추가 오류:', rollbackErr);
      }
    }
    errorEl.textContent = '등록 중 오류가 발생했습니다: ' + err.message;
    errorEl.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '앨범 등록';
  }
});

async function initAdminGalleryPage() {
  __gaProfile = await getCurrentProfile();
  if (!__gaProfile) {
    document.getElementById('adminGuard').hidden = false;
    return;
  }
  document.getElementById('adminContent').hidden = false;
  try {
    await loadAlbumList();
  } catch (err) {
    console.error(err);
    const errEl = document.getElementById('ga-error');
    errEl.textContent = '목록을 불러오지 못했습니다: ' + err.message + ' (Supabase에 supabase/gallery_schema.sql을 실행하셨는지 확인해주세요)';
    errEl.hidden = false;
  }
}

document.addEventListener('DOMContentLoaded', () => setTimeout(initAdminGalleryPage, 400));
</script>
</body>
</html>
