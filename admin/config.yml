backend:
  name: git-gateway
  branch: main

# 저장하면 main에 바로 반영되지 않는다. 대신 cms/... 이름의 별도 브랜치와 PR이 만들어지고
# 관리자 화면 상단 '워크플로우' 탭에 초안으로 쌓인다. 거기서 내용을 확인한 뒤 직접
# 'Publish(배포)' 버튼을 눌러야 PR이 main에 병합되면서 홈페이지에 실제로 배포된다.
# (오너 요청: 확인 후 내가 클릭해서 배포하고 싶다, 2026-08-10 / 근거: decapcms.org 공식문서
#  Editorial Workflow — "Commits to a new branch (cms/collectionName/entrySlug), opens a pull
#  request" → "Approve and publish draft: Merges pull request and deletes branch")
publish_mode: editorial_workflow

media_folder: "admin/uploads"
public_folder: "/admin/uploads"

locale: "ko"

collections:
  - name: "site"
    label: "사이트 기본 설정"
    files:
      - name: "site"
        label: "전체 내용 편집"
        file: "content/site.json"
        fields:
          - label: "메인화면"
            name: "hero"
            widget: object
            fields:
              - { label: "작은 제목", name: "pretitle", widget: string }
              - { label: "강조 단어 (노란색)", name: "pretitle_accent", widget: string }
              - { label: "표어 첫줄", name: "verse_line1", widget: string }
              - { label: "표어 둘째줄", name: "verse_line2", widget: string }
              - { label: "성경구절 출처", name: "reference", widget: string }
              - label: "메인 배경 사진 (15초마다 자동 전환, 16:9 비율 권장)"
                name: "images"
                widget: list
                required: false
                fields:
                  - { label: "사진", name: "image", widget: image }

          - label: "사이트 서체 (홈페이지 전체 글꼴)"
            name: "design"
            widget: object
            fields:
              - label: "글꼴 선택"
                name: "font_id"
                widget: select
                default: "pretendard"
                hint: "홈페이지 모든 페이지의 글꼴이 한번에 바뀝니다. 고딕체는 깔끔하고 현대적이며, 명조체는 차분하고 전통적인 느낌을 줍니다."
                options:
                  - { label: "프리텐다드 (고딕체 · 현재 기본값)", value: "pretendard" }
                  - { label: "본고딕 Noto Sans (고딕체)", value: "noto-sans-kr" }
                  - { label: "본명조 Noto Serif (명조체)", value: "noto-serif-kr" }
                  - { label: "고운바탕 (명조체 · 부드러운 느낌)", value: "gowun-batang" }
                  - { label: "나눔명조 (명조체 · 전통적인 느낌)", value: "nanum-myeongjo" }

          - label: "섹션 배경사진 (메인화면 각 구역의 배경으로 깔릴 사진)"
            name: "section_backgrounds"
            widget: object
            hint: "사진을 올리면 해당 구역 배경으로 깔립니다. 글씨가 잘 보이도록 사진 위에 흰색 반투명 막이 자동으로 덮입니다. 비워두면 원래 배경색이 그대로 유지됩니다. 가로로 긴 사진(16:9 등)을 권장합니다."
            fields:
              - { label: "교회소개 (사람이 교회입니다)", name: "about", widget: image, required: false }
              - { label: "예배안내 (정규 예배 시간표)", name: "worship", widget: image, required: false }
              - { label: "오시는길", name: "visit", widget: image, required: false }

          - label: "교회소개"
            name: "about"
            widget: object
            fields:
              - { label: "정식 교단/교회명", name: "lead", widget: string }
              - { label: "인사말 본문", name: "message", widget: text, hint: "문단을 나누려면 빈 줄을 한 줄 띄워주세요" }
              - { label: "강조 문구", name: "highlight", widget: string }
              - { label: "서명", name: "signature", widget: string }

          - label: "예배안내"
            name: "worship"
            widget: list
            fields:
              - { label: "분류", name: "category", widget: select, options: ["주일예배", "교회학교", "주중예배"], default: "주일예배" }
              - { label: "예배 이름", name: "name", widget: string }
              - { label: "시간", name: "time", widget: string }
              - { label: "장소", name: "location", widget: string, default: "본당" }

          - label: "설교 영상"
            name: "sermon"
            widget: object
            fields:
              - { label: "유튜브 채널 주소", name: "youtube_channel_url", widget: string }
              - { label: "유튜브 업로드 재생목록 ID (채널ID UC를 UU로 바꾸면 됩니다)", name: "youtube_playlist_id", widget: string }

          - label: "헌금안내"
            name: "offering"
            widget: object
            fields:
              - { label: "예금주", name: "holder", widget: string }
              - label: "계좌 목록"
                name: "accounts"
                widget: list
                fields:
                  - { label: "구분", name: "label", widget: string }
                  - { label: "계좌 정보", name: "info", widget: string }

          - label: "매일 묵상 말씀 (팝업에 매일 하나씩 자동으로 바뀌어 표시됩니다)"
            name: "daily_verses"
            widget: list
            hint: "성경 문구는 정확한 번역본(개역개정 권장)을 그대로 옮겨 적어주세요"
            fields:
              - { label: "말씀 본문", name: "text", widget: text }
              - { label: "출처 (예: 요한복음 3장 16절)", name: "reference", widget: string }

          - label: "갤러리 (구글드라이브 링크)"
            name: "gallery"
            widget: list
            required: false
            fields:
              - { label: "제목", name: "title", widget: string }
              - { label: "구글드라이브 링크", name: "drive_url", widget: string }

          - label: "교회 기본정보"
            name: "contact"
            widget: object
            fields:
              - { label: "교회 정식 명칭", name: "church_name", widget: string }
              - { label: "담임목사 성함", name: "pastor", widget: string }
              - { label: "전화번호", name: "phone", widget: string }
              - { label: "팩스번호", name: "fax", widget: string }
              - { label: "이메일", name: "email", widget: string }
              - { label: "주소", name: "address", widget: string }
              - { label: "버스 안내", name: "bus", widget: string }
              - { label: "인스타그램 주소 (없으면 비워두면 메뉴에서 숨겨집니다)", name: "instagram_url", widget: string, required: false }

          - label: "핵심가치"
            name: "core_values"
            widget: list
            required: false
            fields:
              - { label: "제목", name: "title", widget: string }
              - { label: "설명", name: "description", widget: text }

  - name: "notices"
    label: "공지사항"
    files:
      - name: "notices"
        label: "공지사항 목록 (새 글쓰기는 여기서 목록에 추가)"
        file: "content/notices.json"
        fields:
          - label: "공지 목록"
            name: "notices"
            widget: list
            fields:
              - { label: "날짜", name: "date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "제목", name: "title", widget: string }
              - { label: "본문 (선택)", name: "body", widget: text, required: false }

  - name: "bulletins"
    label: "주보"
    files:
      - name: "bulletins"
        label: "주보 목록 (파일 업로드로 새 주보 추가)"
        file: "content/bulletins.json"
        fields:
          - label: "주보 목록"
            name: "bulletins"
            widget: list
            fields:
              - { label: "날짜", name: "date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "제목", name: "title", widget: string, default: "주일 주보" }
              - { label: "주보 파일 (PDF 또는 이미지)", name: "file", widget: file }
